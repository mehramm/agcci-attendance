/* ---------- record dialog: status + reason + note for one mark ---------- */
function openRecordDialog(d, sid, { onDone, sheet } = {}) {
  const s = studentById(sid); if (!s) return;
  let st = rawStatus(d, sid) || '';
  const x = markExtra(d, sid), list = reasonList();
  let reason = x.reason || '';
  const en = enabledStatuses(), shown = [...new Set([...en, ...(st && !en.includes(st) ? [st] : [])])];
  const body = `<div class="rec-dlg">
    <div class="field"><span>Status</span><div class="seg rd-status" role="group" aria-label="Status">${shown.map((k) => `<button type="button" class="${STATUS[k].cls} ${st === k ? 'on' : ''}" data-rst="${k}" aria-pressed="${st === k}">${STATUS[k].label}</button>`).join('')}</div></div>
    <div class="field rd-reason" ${needsReason(st) ? '' : 'hidden'}><span>Reason <span class="field-hint">(optional)</span></span><div class="rchips">${list.map((r) => `<button type="button" class="rchip ${reason === r ? 'on' : ''}" data-rc="${esc(r)}" aria-pressed="${reason === r}">${esc(r)}</button>`).join('')}<button type="button" class="rchip ${reason && !list.includes(reason) ? 'on' : ''}" data-rc="${OTHER}" aria-pressed="${!!(reason && !list.includes(reason))}">Other…</button></div>
      <input type="text" id="rd-other" maxlength="60" placeholder="Other reason" aria-label="Other reason" value="${esc(reason && !list.includes(reason) ? reason : '')}" ${reason && !list.includes(reason) ? '' : 'hidden'}></div>
    <label class="field">Note <span class="field-hint">(optional, short)</span><textarea id="rd-note" rows="2" maxlength="200" placeholder="e.g. Left early for clinic">${esc(x.note || '')}</textarea></label>
    <p class="muted small rd-hint" style="margin:0" ${st ? 'hidden' : ''}>Choose a status to save a reason or note.</p></div>`;
  openModal({ title: sheet ? `Why was ${esc(firstName(s))} ${st === 'E' ? 'excused' : 'absent'}? · ${fmtDate(d, 'dm')}` : `${esc(s.name)} · ${fmtDate(d, 'dm')}`, body, cls: 'rec-modal',
    foot: `<button class="btn btn-ghost" data-close>${sheet ? 'Skip' : 'Cancel'}</button><button class="btn btn-primary" id="rd-save">${icon('check', 'sm')} Save</button>`,
    onMount(el, close) {
      const other = el.querySelector('#rd-other'), rbox = el.querySelector('.rd-reason');
      const sync = () => {
        el.querySelectorAll('[data-rst]').forEach((b) => { b.classList.toggle('on', b.dataset.rst === st); b.setAttribute('aria-pressed', b.dataset.rst === st); });
        rbox.hidden = !needsReason(st); el.querySelector('.rd-hint').hidden = !!st;
        const isOther = reason === OTHER || (reason && !list.includes(reason));
        el.querySelectorAll('[data-rc]').forEach((b) => { const on = b.dataset.rc === OTHER ? isOther : b.dataset.rc === reason; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
        other.hidden = !isOther;
      };
      const commit = () => {
        const note = el.querySelector('#rd-note').value;
        let r = reason === OTHER || (reason && !list.includes(reason)) ? other.value.trim() : reason;
        if (st !== (rawStatus(d, sid) || '')) setStatus(d, sid, st || null);
        if (st) setMarkExtra(d, sid, { reason: needsReason(st) ? r : '', note });
        save(); close();
        toast(`${s.name}: ${st ? STATUS[st].label : 'mark cleared'}${st && needsReason(st) && r ? ' · ' + r : ''}`, { type: 'success', timeout: 1600 });
        if (onDone) onDone(); else afterRecordChange(d, sid);
      };
      el.querySelectorAll('[data-rst]').forEach((b) => (b.onclick = () => { st = st === b.dataset.rst ? '' : b.dataset.rst; sync(); }));
      el.querySelectorAll('[data-rc]').forEach((b) => (b.onclick = () => {
        const v = b.dataset.rc; reason = reason === v || (v === OTHER && reason && !list.includes(reason)) ? '' : v; sync();
        if (v === OTHER && !other.hidden) other.focus();
        else if (sheet && reason && !el.querySelector('#rd-note').value.trim()) commit(); // fast path: one tap picks the reason
      }));
      el.querySelector('#rd-save').onclick = commit;
    } });
}
function afterRecordChange(d, sid) {
  const r = route().name;
  if (r === 'mark' && M.date === d) { if (M.reasonFor && M.reasonFor.sid === sid) M.reasonFor = null; if (M.reasonRow === sid) M.reasonRow = null; if (M.mode === 'list') { updateRow($('#mark-rows'), sid, d); $('#mark-counts').innerHTML = countsHTML(); } else refreshMark(); }
  else { if (HV.reasonRow === sid) HV.reasonRow = null; renderKeepModal(); }
}

/* ---------- per-student dated notes ---------- */

  S.notes.push(n); save(); return n;
}

    <form class="note-add" id="note-add" autocomplete="off"><label class="sr-only" for="note-date">Note date</label><input type="date" id="note-date" value="${t}" max="${addDays(t, 1)}">

    foot: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="ne-save">Save note</button>`,

/* ============ printable reports (sponsors, partners, grants) ============
   One model → two renderers: reportHTML() for the live preview + window.print() (A4 print CSS),
   and reportPDF() — a small built-in PDF writer (standard Helvetica fonts, JPEG photos) for an
   offline "Download PDF" with no network access. */
const RP = { type: 'week', week: '', from: '', to: '', sid: '', day: '', group: '', photos: false, reasons: true, facilitator: null };
const RTYPES = { week: 'Weekly report', range: 'Date range / end of programme', student: 'Per-student report', day: 'Single-day register' };
const RCOL = { good: '#1E8E3E', mid: '#B26A00', bad: '#C62828', none: '#777777', P: '#1E8E3E', L: '#B26A00', E: '#1565C0', A: '#C62828', brand: '#5B1785', brand2: '#C2185B', gold: '#F4B400', ink: '#1D1B22', muted: '#6B6475', line: '#DDD6E3', soft: '#F6F2F9' };
const bandOf = (r) => rateCls(r).replace('rate-', '');
const BAND_LABEL = { good: 'On track', mid: 'Watch', bad: 'Low', none: 'No data' };
function weekRange(d) { const from = addDays(d, -((weekday(d) + 6) % 7)); return [from, addDays(from, 6)]; }
function rangeText(from, to) {
  if (from === to) return fmtDate(from, 'long');
  const y = (i) => i.slice(0, 4), f = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', ...(y(from) !== y(to) ? { year: 'numeric' } : {}), timeZone: 'UTC' }).format(d2(from));
  return `${f} – ${new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }).format(d2(to))}`;
}
function aggregate(list, dates) {
  const t = { P: 0, L: 0, E: 0, A: 0 }; list.forEach((s) => dates.forEach((d) => { const e = effStatus(d, s); if (e) t[e]++; }));
  t.attended = t.P + t.L; t.denom = t.attended + t.A; t.rate = t.denom ? t.attended / t.denom : null; return t;
}
function reportModel(o = RP) {
  const all = sessionDates(), t = todayISO(), last = all.length ? all[all.length - 1] : t;
  const kind = RTYPES[o.type] ? o.type : 'week';
  let from, to, typeTitle, sub = '';
  if (kind === 'week') { [from, to] = weekRange(validISO(o.week) ? o.week : last); typeTitle = 'Weekly attendance report'; }
  else if (kind === 'day') { from = to = validISO(o.day) ? o.day : last; typeTitle = 'Daily attendance register'; }
  else {
    from = validISO(o.from) ? o.from : all[0] || t; to = validISO(o.to) ? o.to : last; if (from > to) [from, to] = [to, from];
    const whole = all.length && from <= all[0] && to >= last;
    typeTitle = kind === 'student' ? 'Individual attendance report' : whole ? 'End-of-programme attendance report' : 'Attendance report for a date range';
  }
  const dates = all.filter((d) => d >= from && d <= to);
  const stu = kind === 'student' ? studentById(o.sid) || sortedStudents()[0] : null;
  const students = stu ? [stu] : sortedStudents().filter((s) => inGroup(s, o.group));
  const th = S.settings.lowThreshold / 100;
  const rows = students.map((s) => { const c = studentStats(s, dates); return { s, c, band: bandOf(c.rate), flags: reasonStats([s], dates).flags }; });
  const tot = aggregate(students, dates);
  const trendDates = kind === 'day' ? all.filter((d) => d <= to).slice(-10) : dates.length > 40 ? dates.slice(-40) : dates;
  const trend = trendDates.map((d) => ({ d, r: aggregate(students, [d]).rate }));
  const gmap = new Map(); students.forEach((s) => { const g = s.group || 'Ungrouped'; if (!gmap.has(g)) gmap.set(g, []); gmap.get(g).push(s); });
  let groupRows = [...gmap.entries()].sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true })).map(([g, l]) => ({ g, n: l.length, ...aggregate(l, dates) }));
  if (stu) { const peers = S.students.filter((x) => (x.group || '') === (stu.group || '')); groupRows = [{ g: stu.name, n: 1, ...aggregate([stu], dates) }, ...(stu.group ? [{ g: stu.group + ' (group)', n: peers.length, ...aggregate(peers, dates) }] : []), { g: 'Whole programme', n: S.students.length, ...aggregate(S.students, dates) }]; }
  const minDen = Math.min(3, Math.max(1, dates.length));
  const low = kind === 'day'
    ? rows.filter((r) => ['A'].includes(effStatus(from, r.s))).map((r) => ({ ...r, c: studentStats(r.s, all.filter((d) => d <= to)) })).filter((r) => r.c.denom >= 3 && r.c.rate < th).sort((a, b) => a.c.rate - b.c.rate)
    : rows.filter((r) => r.c.denom >= minDen && r.c.rate < th).sort((a, b) => a.c.rate - b.c.rate);
  const ids = new Set(students.map((s) => s.id));
  const recNotes = [];
  dates.forEach((d) => students.forEach((s) => { const x = markExtra(d, s.id); if (x.note) recNotes.push({ d, s, st: rawStatus(d, s.id), note: x.note, reason: x.reason || '' }); }));
  const notes = S.notes.filter((n) => ids.has(n.sid) && (stu || (n.date >= from && n.date <= to))).sort((a, b) => a.date.localeCompare(b.date));
  const day = kind === 'day' ? students.map((s) => { const e = effStatus(from, s), r = rawStatus(from, s.id), x = markExtra(from, s.id); return { s, st: e, raw: r, reason: x.reason || '', note: [x.note, e && !r ? 'not marked' : ''].filter(Boolean).join(' · ') }; }) : null;
  const history = stu ? studentStats(stu, dates).history.map((h) => ({ ...h, ...markExtra(h.d, stu.id) })) : null;
  const now = new Date();
  return {
    kind, from, to, dates, students, rows, tot, trend, groupRows, low, stu, day, history, notes, recNotes,
    reasons: reasonStats(students, dates), threshold: S.settings.lowThreshold,
    title: S.settings.reportTitle || 'Attendance report', typeTitle, range: rangeText(from, to), org: S.settings.name, address: S.settings.orgAddress || '',
    group: kind === 'student' ? '' : o.group ? groupLabel(o.group) : '', photos: !!o.photos, withReasons: o.reasons !== false,
    facilitator: o.facilitator != null ? o.facilitator : S.settings.facilitator || S.settings.instructor || '',
    sample: !!S.meta.sample, generated: `${fmtDate(todayISO(), 'med')}, ${nowHM()} GMT`, generatedAt: now.getTime(),
    logo: S.settings.logo || '',
  };
}

/* ---------- HTML renderer (preview + print) ---------- */
let rptSeq = 0; // unique gradient id per render: a gradient inside a display:none copy would blank the print copy
const rptLogo = (m) => { const id = 'lgrpt' + ++rptSeq; return m.logo ? `<img src="${esc(m.logo)}" alt="">` : LOGO_M.replace(/lg2/g, id).replace('class="logo"', 'class="rpt-logo-svg"'); };
const rptBadge = (band, r) => `<span class="rb rb-${band}">${pct(r)}${band === 'none' ? '' : ' · ' + BAND_LABEL[band]}</span>`;
const rptSt = (st) => (st ? `<span class="rs rs-${st}">${STATUS[st].label}</span>` : '<span class="rs rs-U">—</span>');
function rptTrendSVG(m) {
  const W = 360, H = 130, pl = 28, pb = 18, pt = 8, n = m.trend.length, cw = (W - pl - 4) / Math.max(1, n), bw = Math.max(3, Math.min(28, cw * 0.7));
  const y = (r) => pt + (H - pt - pb) * (1 - r), thr = m.threshold / 100;
  let g = [0, 0.5, 1].map((r) => `<line x1="${pl}" x2="${W - 4}" y1="${y(r)}" y2="${y(r)}" stroke="#E8E2EE"/><text x="${pl - 4}" y="${y(r) + 3}" text-anchor="end" font-size="8" fill="#6B6475">${r * 100}%</text>`).join('');
  if (m.kind === 'student') {
    g += m.history.map((h, i) => { const x = pl + i * cw + (cw - bw) / 2, v = h.s === 'P' ? 1 : h.s === 'L' ? 0.75 : h.s === 'E' ? 0.4 : 0.12; return `<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(0) - y(v)).toFixed(1)}" rx="1.5" fill="${RCOL[h.s]}"/>`; }).join('');
  } else {
    g += m.trend.map((p, i) => { if (p.r == null) return ''; const x = pl + i * cw + (cw - bw) / 2; return `<rect x="${x.toFixed(1)}" y="${y(p.r).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(0) - y(p.r)).toFixed(1)}" rx="1.5" fill="${RCOL[bandOf(p.r)]}"/>`; }).join('');
    g += `<line x1="${pl}" x2="${W - 4}" y1="${y(thr)}" y2="${y(thr)}" stroke="#C62828" stroke-dasharray="4 3"/><rect x="${W - 52}" y="${y(thr) - 11}" width="48" height="9" rx="2" fill="#fff"/><text x="${W - 5}" y="${y(thr) - 4}" text-anchor="end" font-size="7.5" font-weight="700" fill="#C62828">${m.threshold}% target</text>`;
  }
  const pts = m.kind === 'student' ? m.history.map((h) => h.d) : m.trend.map((p) => p.d);
  if (pts.length) g += `<text x="${pl}" y="${H - 4}" font-size="8" fill="#6B6475">${fmtDate(pts[0], 'short')}</text>${pts.length > 1 ? `<text x="${W - 4}" y="${H - 4}" font-size="8" text-anchor="end" fill="#6B6475">${fmtDate(pts[pts.length - 1], 'short')}</text>` : ''}`;
  else g += `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" font-size="10" fill="#6B6475">No sessions in this period</text>`;
  return `<svg class="rpt-chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Attendance trend">${g}</svg>`;
}
function rptPhoto(m, s) { if (!m.photos) return ''; return `<td class="rpt-ph">${hasPhoto(s.id) ? `<img src="${photoURL(s.id)}" alt="">` : `<span class="rpt-ini" style="background:${avColor(s)}">${esc(initials(s.name))}</span>`}</td>`; }
function reportHTML(m) {
  const T = m.tot, stat = (k, v, cls = '') => `<div class="rpt-stat ${cls}"><div class="v">${v}</div><div class="k">${k}</div></div>`;
  const statBoxes = m.kind === 'student'
    ? [stat('Sessions', m.rows[0].c.sessions), stat('Attendance rate', pct(T.rate), 'rb-' + bandOf(T.rate)), stat('Present', T.P, 'st-P'), stat('Late', T.L, 'st-L'), stat('Excused', T.E, 'st-E'), stat('Absent', T.A, 'st-A')]
    : [stat('Sessions held', m.dates.length), stat('Enrolled', m.students.length), stat('Average rate', pct(T.rate), 'rb-' + bandOf(T.rate)), stat('Present', T.P, 'st-P'), stat('Late', T.L, 'st-L'), stat('Excused', T.E, 'st-E'), stat('Absent', T.A, 'st-A')];
  const groupTbl = `<table class="rpt-mini"><thead><tr><th>${m.kind === 'student' ? 'Compared with' : 'Group'}</th><th class="n">${m.kind === 'student' ? '' : 'Students'}</th><th class="n">P/L/E/A</th><th class="n">Rate</th></tr></thead><tbody>${m.groupRows.map((g) => `<tr><td>${esc(g.g)}</td><td class="n">${m.kind === 'student' ? '' : g.n}</td><td class="n">${g.P}/${g.L}/${g.E}/${g.A}</td><td class="n">${rptBadge(bandOf(g.rate), g.rate)}</td></tr>`).join('') || '<tr><td colspan="4">No students</td></tr>'}</tbody></table>`;

const CODE_GS = "/**\n * AGCCI Attendance — Google Sheets sync\n * ------------------------------------------------------------------\n * 1. In your Google Sheet: Extensions → Apps Script. Delete what's there and paste this whole file. Save.\n * 2. Choose the function \"setup\" in the toolbar and press Run. Allow access (Advanced → Go to … (unsafe) → Allow).\n *    The sync key appears in the Execution log below the code (later also via the sheet menu \"AGCCI Sync → Show sync key\").\n * 3. Deploy → New deployment → type \"Web app\" → Execute as: Me · Who has access: Anyone → Deploy. Copy the Web app URL.\n * 4. In the AGCCI app: Settings → Sync with Google Sheets → paste the URL and the key. Use the same URL + key on every device.\n *\n * Data lives in this spreadsheet (tabs Students, Attendance, Notes, Sessions, Settings, Tombstones, Summary)\n * and photos in the Drive folder \"AGCCI Photos\" (one small JPEG per student, named <student key>.jpg, plus the shared logo).\n * Every request must carry the secret key.\n * Only whitelisted record types and fields are accepted — anything else (e.g. face descriptors) is dropped.\n *\n * Updating from an older version: paste this whole file over the old code, Save, then Deploy → Manage deployments →\n * (pencil) Edit → Version: New version → Deploy. The Web app URL and the sync key stay the same.\n */\nvar SYNC_VERSION = 4; // v2: Students.faceConsent/faceConsentOn · Attendance.via (\"Face match\") · v3: shared custom logo (file in the Drive folder)\n                      // v4: student photos get their own endpoints (photoList / photoGet / photoPut / photoDel) with a SHA-256 hash per photo,\n                      //     so devices download only photos that changed; older apps keep sending photos inside the sync action\nvar TZ = 'Africa/Accra';\nvar PHOTO_FOLDER = 'AGCCI Photos';\nvar MAX_PHOTOS_PER_PULL = 12;\nvar MAX_PHOTO_BYTES = 1500000;\nvar MAX_LOGO_B64 = 140000; // ≈100 KB image; the app resizes logos before sending d (ms)', 'n'], ['updatedAt', 'Updated (ms)', 'n'], ['deleted', 'Deleted', 'b'], ['rev', 'Rev', 'n'], ['changed', 'Last changed (GMT)', 't']],\n  Sessions: [['date', 'Date', 't'], ['taken', 'Saved at (ms)', 'n'], ['takenText', 'Saved at (GMT)', 't'], ['updatedAt', 'Updated (ms)', 'n'], ['deleted', 'Deleted', 'b'], ['rev', 'Rev', 'n'], ['changed', 'Last changed (GMT)', 't']],\n  Settings: [['key', 'Setting', 't'], ['value', 'Value (JSON)', 't'], ['updatedAt', 'Updated (ms)', 'n'], ['rev', 'Rev', 'n'], ['changed', 'Last changed (GMT)', 't']],\n  Tombstones: [['kind', 'Type', 't'], ['id', 'Key', 't'], ['deletedAt', 'Deleted at (ms)', 'n'], ['rev', 'Rev', 'n'], ['changed', 'Deleted (GMT)', 't']]\n};\nvar KEYS = { Students: ['id'], Attendance: ['date', 'studentId'], Notes: ['id'], Sessions: ['date'], Settings: ['key'], Tombstones: ['kind', 'id'] };\n\n/* ================= setup & menu ================= */\nfunction setup() {\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  Object.keys(SCHEMA).forEach(function (name) { tab_(ss, name); });\n  summarySheet_(ss);\n  photoFolder_();\n  var props = PropertiesService.getScriptProperties();\n  var key = props.getProperty('SYNC_KEY');\n  if (!key) { key = (Utilities.getUuid() + Utilities.getUuid()).replace(/-/g, '').slice(0, 32); props.setProperty('SYNC_KEY', key); }\n  if (!props.getProperty('REV')) props.setProperty('REV', '0');\n  rebuildSummary_(ss, null);\n  var msg = 'AGCCI sync is set up.\\n\\nYour sync key:\\n' + key + '\\n\\nNext: Deploy → New deployment → Web app (Execute as: Me, Who has access: Anyone), then paste the Web app URL and this key into the app.';\n  // shown in the editor's Execution log (a dialog here could wait unseen in the spreadsheet tab); the sheet menu\n  // \"AGCCI Sync → Show sync key\" shows it again at any time\n  Logger.log(msg);\n  return key;\n}\nfunction onOpen() {\n  try { SpreadsheetApp.getUi().createMenu('AGCCI Sync').addItem('Show sync key', 'showKey').addItem('Rebuild summary', 'rebuildSummaryNow').addItem('Make a new sync key…', 'resetKey').addToUi(); } catch (e) { /* no UI */ }\n}\nfunction showKey() {\n  var key = PropertiesService.getScriptProperties().getProperty('SYNC_KEY') || setup();\n  SpreadsheetApp.getUi().alert('AGCCI sync key', 'Paste this key into the app (Settings → Sync with Google Sheets):\\n\\n' + key, SpreadsheetApp.getUi().ButtonSet.OK);\n}\nfunction resetKey() {\n  var ui = SpreadsheetApp.getUi();\n  if (ui.alert('Make a new sync key?', 'Every device will need the new key.', ui.ButtonSet.OK_CANCEL) !== ui.Button.OK) return;\n  PropertiesService.getScriptProperties().deleteProperty('SYNC_KEY'); showKey();\n}\nfunction rebuildSummaryNow() { rebuildSummary_(SpreadsheetApp.getActiveSpreadsheet(), null); }\n\n/* ================= web app entry points ================= */\n// The app POSTs JSON as text/plain (a \"simple\" request → no CORS preflight). Google answers with a 302 to\n// script.googleusercontent.com, which the browser follows; that response carries Access-Control-Allow-Origin: *.\nfunction doPost(e) {\n  var req;\n  try { req = JSON.parse((e && e.postData && e.postData.contents) || '{}'); } catch (x) { return out_(fail_('bad_request', 'Body is not JSON')); }\n  return out_(handle_(req));\n}\nfunction doGet(e) {\n  var p = (e && e.parameter) || {};\n  if (p.payload) { try { return out_(handle_(JSON.parse(p.payload))); } catch (x) { return out_(fail_('bad_request', 'payload is not JSON')); } }\n  return out_({ ok: true, app: 'agcci-sync', version: SYNC_VERSION, message: 'AGCCI sync is running. Paste this URL into the app.' });\n}\nfunction out_(obj) { return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON); }\nfunction fail_(code, message) { return { ok: false, error: code, message: message || code, app: 'agcci-sync', version: SYNC_VERSION }; }\n\nfunction handle_(req) {\n  try {\n    if (!req || typeof req !== 'object') return fail_('bad_request');\n    var props = PropertiesService.getScriptProperties();\n    var key = props.getProperty('SYNC_KEY');\n    if (!key) return fail_('not_setup', 'Open the Apps Script editor and run setup() once.');\n    if (typeof req.key !== 'string' || req.key !== key) return fail_('bad_key', 'The sync key does not match. Copy it again from the sheet (AGCCI Sync → Show sync key).');\n    var action = String(req.action || 'ping');\n    if (['ping', 'pull', 'push', 'sync', 'photoList', 'photoGet', 'photoPut', 'photoDel'].indexOf(action) < 0) return fail_('bad_request', 'Unknown action');\n    // read-only photo requests don't need the lock (they only read the Students tab and Drive files)\n    if (action === 'photoList' || action === 'photoGet') {\n      var rs = SpreadsheetApp.getActiveSpreadsheet(), rdb = new Db_(rs), rr = { ok: true, app: 'agcci-sync', version: SYNC_VERSION, serverTime: Date.now() };\n      if (action === 'photoList') rr.list = photoList_(rdb, +req.since || 0, props);\n      else rr.get = photoGet_(rdb, Array.isArray(req.ids) ? req.ids : []);\n      return rr;\n    }\n    var lock = LockService.getScriptLock();\n    if (!lock.tryLock(25000)) return fail_('busy', 'Another device is syncing — trying again shortly.');\n    try {\n      var ss = SpreadsheetApp.getActiveSpreadsheet(), db = new Db_(ss), res = { ok: true, app: 'agcci-sync', version: SYNC_VERSION, serverTime: Date.now() };\n      if (action === 'ping') {\n        var c = db.counts(); res.counts = c; res.empty = !c.students && !c.marks && !c.notes; res.cursor = +props.getProperty('REV') || 0; res.sheet = ss.getName();\n        return res;\n      }\n      if (action === 'photoPut' || action === 'photoDel') { res.put = photoWrite_(db, action === 'photoPut' ? req.photos : null, action === 'photoDel' ? req.deleted : null, props); res.cursor = +props.getProperty('REV') || 0; return res; }\n      if (action === 'push' || action === 'sync') res.push = push_(db, req.changes || {}, props);\n      // photoApi 4 = the app fetches photos with photoList/photoGet, so \"pull\" leaves them out\n      if (action === 'pull' || action === 'sync') res.pull = pull_(db, +req.since || 0, req.photoSince == null ? +req.since || 0 : +req.photoSince, props, +req.photoApi >= 4);\n      res.cursor = +props.getProperty('REV') || 0;\n      return res;\n    } finally { lock.releaseLock(); }\n  } catch (x) {\n    var m = String((x && x.message) || x);\n    if (/too many times|quota|Service invoked|limit exceeded|Bandwidth|rate limit/i.test(m)) return fail_('quota', 'Google quota reached: ' + m);\n    return fail_('server', m);\n  }\n}\n\n/* ================= tiny table layer (one read + one write per tab per request) ================= */\nfunction Db_(ss) { this.ss = ss; this.tabs = {}; }\nDb_.prototype.tab = function (name) {\n  if (this.tabs[name]) return this.tabs[name];\n  var sh = tab_(this.ss, name), cols = SCHEMA[name], last = sh.getLastRow();\n  var header = sh.getRange(1, 1, 1, Math.max(sh.getLastColumn(), 1)).getValues()[0].map(String);\n  var pos = {}; cols.forEach(function (c) { pos[c[0]] = header.indexOf(c[1]); });\n  cols.forEach(function (c) { if (pos[c[0]] < 0) { header.push(c[1]); pos[c[0]] = header.length - 1; sh.getRange(1, header.length).setValue(c[1]).setFontWeight('bold'); } });\n  var raw = last > 1 ? sh.getRange(2, 1, last - 1, header.length).getValues() : [];\n  var rows = raw.map(function (r) { var o = {}; cols.forEach(function (c) { o[c[0]] = cell_(r[pos[c[0]]], c[2]); }); return o; });\n  var index = {}; rows.forEach(function (o, i) { index[keyOf_(name, o)] = i; });\n  var t = { name: name, sh: sh, header: header, pos: pos, rows: rows, index: index, raw: raw, dirtyFrom: Infinity };\n  this.tabs[name] = t; return t;\n};\nDb_.prototype.get = function (name, key) { var t = this.tab(name), i = t.index[key]; return i == null ? null : t.rows[i]; };\nDb_.prototype.put = function (name, obj) {\n  var t = this.tab(name), k = keyOf_(name, obj), i = t.index[k];\n  obj.changed = fmt_(Date.now());\n  if (i == null) { i = t.rows.length; t.rows.push(obj); t.index[k] = i; } else t.rows[i] = obj;\n  t.dirtyFrom = Math.min(t.dirtyFrom, i);\n};\nDb_.prototype.flush = function () {\n  var self = this;\n  Object.keys(this.tabs).forEach(function (name) {\n    var t = self.tabs[name]; if (t.dirtyFrom === Infinity) return;\n    var cols = SCHEMA[name], from = t.dirtyFrom, n = t.rows.length - from, w = t.header.length;\n    var vals = [], fmts = [];\n    for (var i = from; i < t.rows.length; i++) {\n      var row = i < t.raw.length ? t.raw[i].slice() : new Array(w).fill(''), f = new Array(w).fill('@');\n      while (row.length < w) row.push('');\n      cols.forEach(function (c) { var p = t.pos[c[0]], v = t.rows[i][c[0]]; row[p] = out(v, c[2]); f[p] = c[2] === 'n' ? '0' : c[2] === 'b' ? '@' : '@'; });\n      vals.push(row); fmts.push(f);\n    }\n    function out(v, type) { if (type === 'n') return v === '' || v == null ? '' : Number(v) || 0; if (type === 'b') return v ? 'TRUE' : ''; v = v == null ? '' : String(v); return /^[=+\\-@]/.test(v) ? \"'\" + v : v; }\n    var rg = t.sh.getRange(from + 2, 1, n, w);\n    rg.setNumberFormats(fmts); rg.setValues(vals);\n    t.dirtyFrom = Infinity;\n  });\n};\nDb_.prototype.counts = function () {\n  var live = function (rows) { return rows.filter(function (r) { return !r.deleted; }).length; };\n  return { students: live(this.tab('Students').rows), marks: live(this.tab('Attendance').rows), notes: live(this.tab('Notes').rows), sessions: live(this.tab('Sessions').rows) };\n};\nfunction keyOf_(name, o) { return KEYS[name].map(function (k) { return o[k]; }).join('|'); }\nfunction cell_(v, type) {\n  if (type === 'n') return v === '' || v == null ? 0 : Number(v) || 0;\n  if (type === 'b') return v === true || String(v).toUpperCase() === 'TRUE';\n  if (v instanceof Date) return Utilities.formatDate(v, TZ, 'yyyy-MM-dd'); // a date the sheet auto-converted\n  return v == null ? '' : String(v);\n}\nfunction fmt_(ms) { return ms ? Utilities.formatDate(new Date(ms), TZ, 'yyyy-MM-dd HH:mm') : ''; }\nfunction tab_(ss, name) {\n  var sh = ss.getSheetByName(name);\n  if (!sh) {\n    sh = ss.insertSheet(name);\n    var cols = SCHEMA[name];\n    sh.getRange(1, 1, 1, cols.length).setValues([cols.map(function (c) { return c[1]; })]).setFontWeight('bold').setBackground('#EFE6F5');\n    sh.setFrozenRows(1);\n  }\n  return sh;\n}\n\n/* ================= validation (whitelist only) ================= */\nfunction str_(v, max) { return v == null ? '' : String(v).slice(0, max || 200); }\nfunction okId_(v) { return typeof v === 'string' && /^[A-Za-z0-9_.-]{1,64}$/.test(v); }\nfunction okDate_(v) { return typeof v === 'string' && /^\\d{4}-\\d{2}-\\d{2}$/.test(v); }\nfunction ts_(v) { v = Number(v); return isFinite(v) && v > 0 && v < 4102444800000 ? Math.floor(v) : 0; }\nfunction statusOf_(v) { v = String(v || ''); if (STATUS_LABEL[v]) return v; for (var k in STATUS_LABEL) if (STATUS_LABEL[k] === v) return k; return ''; }\n\n/* ================= push: last write wins by updatedAt ================= */\nfunction push_(db, ch, props) {\n  var rev = (+props.getProperty('REV') || 0) + 1, stat = { applied: 0, stale: 0, ignored: 0, photos: 0, replaced: 0 }, touched = false, needSummary = false;\n  // replaced = an existing, different live row was overwritten by a newer edit (reported as a resolved conflict)\n  var chg = function (cur, o, f) { if (cur && !cur.deleted && f.some(function (k) { return String(cur[k]) !== String(o[k]); })) stat.replaced++; return o; };\n  var studentName = function (id) { var s = db.get('Students', id); return s ? s.name : ''; }, studentGroup = function (id) { var s = db.get('Students', id); return s ? s.group : ''; };\n  var newer = function (cur, at) { if (!cur || (cur.updatedAt || 0) < at) return true; stat.stale++; return false; };\n  var arr = function (x) { return Array.isArray(x) ? x : []; };\n  arr(ch.students).forEach(function (s) {\n    var at = ts_(s && s.updatedAt); if (!s || !okId_(s.id) || !at || !str_(s.name)) { stat.ignored++; return; }\n    var cur = db.get('Students', s.id); if (!newer(cur, at)) return;\n    db.put('Students', chg(cur, { id: s.id, name: str_(s.name, 120), group: str_(s.group, 120), sid: str_(s.sid, 60), phone: str_(s.phone, 40), email: str_(s.email, 120), joined: okDate_(s.joined) ? s.joined : '', created: ts_(s.created),\n      // consent is a plain yes/no + date; a client that doesn't send the field (older app) keeps the stored value\n      faceConsent: 'faceConsent' in s ? s.faceConsent === true : !!(cur && cur.faceConsent), faceConsentOn: ('faceConsent' in s ? s.faceConsent === true && okDate_(s.faceConsentOn) ? s.faceConsentOn : '' : cur ? cur.faceConsentOn || '' : ''),\n      photoFileId: cur ? cur.photoFileId : '', photoAt: cur ? cur.photoAt : 0, photoRev: cur ? cur.photoRev : 0, photoHash: cur ? cur.photoHash || '' : '', updatedAt: at, deleted: false, rev: rev }, ['name', 'group', 'sid', 'phone', 'email', 'joined', 'faceConsent']));\n    stat.applied++; touched = needSummary = true;\n  });\n  arr(ch.sessions).forEach(function (s) {\n    var at = ts_(s && s.updatedAt); if (!s || !okDate_(s.date) || !at) { stat.ignored++; return; }\n    var curS = db.get('Sessions', s.date); if (!newer(curS, at)) return;\n    var tk = ts_(s.taken); db.put('Sessions', { date: s.date, taken: tk, takenText: fmt_(tk), updatedAt: at, deleted: false, rev: rev });\n    stat.applied++; touched = needSummary = true;\n  });\n  arr(ch.marks).forEach(function (m) {\n    var at = ts_(m && m.updatedAt), st = statusOf_(m && m.status); if (!m || !okDate_(m.date) || !okId_(m.sid) || !at || !st) { stat.ignored++; return; }\n    var curM = db.get('Attendance', m.date + '|' + m.sid); if (!newer(curM, at)) return;\n    db.put('Attendance', chg(curM, { date: m.date, studentId: m.sid, studentName: studentName(m.sid), group: studentGroup(m.sid), status: STATUS_LABEL[st], reason: str_(m.reason, 60), note: str_(m.note, 300), via: m.via === 'face' ? 'Face match' : '', updated /* ============ sample data ============ */
function mulberry(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
async function loadSample() {
  if (syncOn()) {
    const ok = await confirmDialog({ title: 'Turn off sync to load sample data?', body: '<p>Sample students are fictional. To keep them out of your Google Sheet, sync is turned off on this device first — the sheet keeps your real data.</p><p class="muted small">Later, clear the sample and reconnect with the same URL and key to download your real data again.</p>', ok: 'Turn off sync & continue' });
    if (!ok) return;
    await syncDisconnectBtn('keep');
  }
  if (S.students.length && !S.meta.sample) {
    const ok = await confirmDialog({ title: 'Replace your data with sample data?', body: '<p>Sample data contains fictional students and fake attendance for demo purposes. <b>Your current students and attendance will be replaced.</b> Download a backup first if you need it.</p>', ok: 'Replace with sample', danger: true });
    if (!ok) return;
  }
  const rows = parseDelimited(SAMPLE_CSV), t = todayISO(), rnd = mulberry(20260925);
  const start = addDays(t, -35);
  const nd = defaults(); nd.settings = S.settings; nd.meta.sample = true;
  const rel = [0.97, 0.9, 0.62, 0.95, 0.85, 0.93, 0.55, 0.98, 0.88, 0.8, 0.92, 0.7, 0.96, 0.9, 0.86];
  nd.students = rows.slice(1).map((r, i) => ({ id: 'smp' + (i + 1), name: r[0], group: r[1], sid: r[2], phone: r[3], email: r[4], joined: start, created: Date.now() }));
  for (let d = addDays(start, 1); d < t; d = addDays(d, 1)) {
    if (!nd.settings.sessionDays.includes(weekday(d))) continue;
    const recs = {};
    nd.students.forEach((s, i) => { const x = rnd(), r = rel[i]; recs[s.id] = x < r - 0.08 ? 'P' : x < r ? 'L' : x < r + 0.04 ? 'E' : 'A'; });
    nd.sessions[d] = { records: recs, extra: {}, at: {}, taken: d2(d).getTime() + 9.5 * 3600e3, created: d2(d).getTime() };
  }
  // fictional absence reasons + notes (separate RNG so the attendance pattern stays the same)
  const rr = mulberry(424242), R = nd.settings.reasons && nd.settings.reasons.length ? nd.settings.reasons : DEFAULT_REASONS;
  const pickR = (i) => { if (i === 6 && rr() < 0.8) return 'Transport'; if (i === 2 && rr() < 0.6) return rr() < 0.5 ? 'Family' : 'School/exams'; const x = rr(); return x < 0.28 ? 'Sick' : x < 0.5 ? 'Transport' : x < 0.64 ? 'Family' : x < 0.76 ? 'School/exams' : x < 0.84 ? 'Travel' : x < 0.94 ? 'No reason given' : 'Clinic appointment'; };
  const LATE_NOTES = ['Bus broke down on the way', 'Traffic at Kaneshie', 'Helped at home first', 'Came from a school exam'];
  Object.entries(nd.sessions).forEach(([d, ss]) => nd.students.forEach((s, i) => {
    const st = ss.records[s.id];
    if ((st === 'A' || st === 'E') && rr() < 0.75) { let r = pickR(i); if (!R.includes(r) && r !== 'Clinic appointment') r = R[0]; ss.extra[s.id] = { reason: r }; if (st === 'E' && rr() < 0.3) ss.extra[s.id].note = 'Told us in advance'; }
    else if (st === 'L' && rr() < 0.25) ss.extra[s.id] = { note: LATE_NOTES[Math.floor(rr() * LATE_NOTES.length)] };
  }));
  const sd = Object.keys(nd.sessions).sort(), at = (k) => sd[Math.min(sd.length - 1, Math.max(0, k))] || t;
  nd.notes = [
    ['smp7', at(6), 'Spoke with her guardian: trotro fare to the hub has gone up. Exploring a transport stipend. (sample note)'],
    ['smp7', at(sd.length - 3), 'Transport stipend approved from next week; follow up on attendance. (sample note)'],
    ['smp3', at(9), 'Has end-of-term school exams this month — agreed she can catch up with recordings. (sample note)'],
    ['smp1', at(sd.length - 2), 'Excellent project demo — consider her as a peer mentor. (sample note)'],
    ['smp12', at(12), 'Laptop battery is failing; lent a charger. (sample note)'],
  ].map(([sid, date, text], k) => ({ id: 'smpn' + (k + 1), sid, date, text, createdAt: d2(date).getTime() + 15 * 3600e3 }));
  S = nd; save(); await clearPhotos(); M.date = null; HV.date = null; SV.sel.clear();
  toast('Sample data loaded — fictional names, for demo only', { type: 'success', timeout: 4500 });
  go('#/dashboard');
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName !== 'INPUT') e.preventDefault();
  fn(el, e);
});
$('#file-restore').addEventListener('change', (e) => { const f = e.target.files[0]; if (f) restoreFile(f); });

/* ============ global search ============ */
let gIdx = 0;
function closeResults() { $('#gresults').hidden = true; }
function drawResults() {
  const q = $('#gsearch').value.trim().toLowerCase(), box = $('#gresults');
  if (!q) { closeResults(); return; }
  const res = sortedStudents().map((s) => { const n = s.name.toLowerCase(); const score = n.startsWith(q) ? 0 : n.split(/\s+/).some((p) => p.startsWith(q)) ? 1 : n.includes(q) ? 2 : [s.sid, s.phone, s.email, s.group].some((f) => (f || '').toLowerCase().includes(q)) ? 3 : 9; return { s, score }; }).filter((x) => x.score < 9).sort((a, b) => a.score - b.score).slice(0, 8);
  gIdx = Math.min(gIdx, Math.max(0, res.length - 1));
  const dates = sessionDates();
  box.innerHTML = res.length ? res.map((x, i) => `<button type="button" class="${i === gIdx ? 'hl' : ''}" data-go="${x.s.id}">${avatar(x.s)}<span style="flex:1;min-width:0"><b>${esc(x.s.name)}</b><br><span class="muted small">${esc(x.s.group || 'No group')}</span></span>${ratePill(studentStats(x.s, dates).rate)}</button>`).join('') : `<div class="empty">No student matches “${esc(q)}”</div>`;
  box.hidden = false;
}
function pickResult(id) { $('#gsearch').value = ''; closeResults(); $('#topbar').classList.remove('searching'); $('#gsearch').blur(); go('#/student/' + id); }
$('#gsearch').addEventListener('input', () => { gIdx = 0; drawResults(); });
$('#gsearch').addEventListener('focus', drawResults);
$('#gsearch').addEventListener('keydown', (e) => {
  const btns = $$('#gresults [data-go]');
  if (e.key === 'ArrowDown') { e.preventDefault(); gIdx = Math.min(btns.length - 1, gIdx + 1); drawResults(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); gIdx = Math.max(0, gIdx - 1); drawResults(); }
  else if (e.key === 'Enter') { const b = btns[gIdx]; if (b) pickResult(b.dataset.go); }
  else if (e.key === 'Escape') { $('#gsearch').value = ''; closeResults(); $('#topbar').classList.remove('searching'); $('#gsearch').blur(); }
});
$('#gresults').addEventListener('mousedown', (e) => { const b = e.target.closest('[data-go]'); if (b) { e.preventDefault(); pickResult(b.dataset.go); } });
$('#gresults').addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) pickResult(b.dataset.go); });
document.addEventListener('click', (e) => { if (!e.target.closest('.search') && !e.target.closest('[data-act=toggleSearch]')) closeResults(); });

/* ============ keyboard ============ */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalStack.length) { modalStack[modalStack.length - 1].close(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select'].includes(tag) || e.metaKey || e.ctrlKey || e.altKey || modalStack.length) return;
  if (e.key === '/') { e.preventDefault(); if (getComputedStyle($('.topbar .search')).display === 'none') $('#topbar').classList.add('searching'); $('#gsearch').focus(); return; }
  if (route().name === 'mark' && M.mode === 'cards' && S.students.length) {
    const k = e.key.toLowerCase(), en = enabledStatuses();
    const map = { p: 'P', a: 'A', l: 'L', e: 'E' };
    if (/^[1-9]$/.test(k) && stripVisible()) { const r = reasonList()[+k - 1]; if (r) { e.preventDefault(); const f = M.reasonFor; setMarkExtra(f.d, f.sid, { reason: r }); save(); afterReason('card', f.d, f.sid); } }
    else if (k === 'escape' && stripVisible()) { M.reasonFor = null; refreshMark(); }
    else if (map[k] && en.includes(map[k]) && !M.showDone) { e.preventDefault(); cardMark(map[k]); }
    else if (k === 'arrowleft') { e.preventDefault(); ACT.cardBack(); }
    else if (k === 'arrowright') { e.preventDefault(); ACT.cardSkip(); }
    else if (k === 'u' || k === 'backspace' || k === 'z') { e.preventDefault(); cardUndo(); }
    else if (k === 'enter' && M.showDone) { e.preventDefault(); finishSession(M.date); }
  }
});

/* ============ reminders ============ */
function fireReminder(test) {
  const st = S.settings, t = todayISO();
  const body = test ? 'This is how your attendance reminder will look.' : `Time to take today's attendance (${fmtDate(t, 'dm')}).`;
  toast((test ? 'Test: ' : '⏰ ') + body, { action: { label: 'Mark now', fn: () => go('#/mark/' + t) }, timeout: 9000 });
  if (st.notify && 'Notification' in window && Notification.permission === 'granted') {
    try { const n = new Notification(st.name, { body, tag: 'agcci-reminder', icon: document.querySelector('link[rel=icon]').href }); n.onclick = () => { window.focus(); go('#/mark/' + t); n.close(); }; } catch (e) { /* some mobile browsers only allow notifications via a service worker */ }
  }
}
function checkReminder() {
  const st = S.settings, t = todayISO();
  if (!S.students.length || !isSessionDay(t) || isTaken(t) || st.lastNotified === t || nowHM() < st.reminderTime) return;
  const [h, m] = st.reminderTime.split(':').map(Number), [nh, nm] = nowHM().split(':').map(Number);
  if (nh * 60 + nm - (h * 60 + m) > 600) return; // don't nag late at night
  st.lastNotified = t; save(); fireReminder(false); renderBanner(route());
}

/* ============ responsive layout mode ============ */
// phone: bottom tab bar · rail: collapsed icon sidebar (tablets, landscape phones) · full: labelled sidebar
function applyLayout() {
  const w = window.innerWidth, h = window.innerHeight, L = document.documentElement;
  const short = h <= 500;
  const mode = w < 600 && !short ? 'phone' : w < 1200 || short ? 'rail' : 'full';
  const changed = L.dataset.layout !== mode || L.classList.contains('short') !== short;
  L.dataset.layout = mode; L.classList.toggle('short', short);
  L.classList.toggle('narrow-search', mode !== 'phone' && w < 720);
  return changed;
}
applyLayout();
window.addEventListener('resize', debounce(() => {
  const changed = applyLayout();
  if (!changed) return;
  if (!$('#topbar').contains(document.activeElement)) $('#topbar').classList.remove('searching');
  if (route().name === 'mark' && !modalStack.length) render();
}, 120));
window.addEventListener('resize', debounce(() => { if (route().name === 'dashboard') fitChart(); }, 150));

/* ============ init ============ */
window.addEventListener('hashchange', () => { closeResults(); render(); window.scrollTo({ top: 0, behavior: 'instant' }); });
window.addEventListener('storage', (e) => { if (e.key === KEY) { Store.reload(); render(); } });
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) { /* old Safari */ }
applyBrand(true);
applyTheme();
render();
const photosReady = photosInit().catch((e) => console.error(e)).then(() => { if (!modalStack.length || route().name !== 'settings') render(); });
syncInit();
setInterval(() => { checkReminder(); if (document.visibilityState === 'visible' && !modalStack.length) renderBanner(route()); }, 30000);
setTimeout(checkReminder, 1500);
let lastDay = todayISO();
setInterval(() => { const t = todayISO(); if (t !== lastDay) { lastDay = t; if (route().name !== 'mark') M.date = null; if (!modalStack.length) render(); } }, 60000);
window.AGCCI = { get state() { return S; }, Store, RP, reportModel, reportHTML, reportPDF, preparePrint, cleanupPrint, reasonStats, todayISO, readXlsx, makeXlsx, parseDelimited, detectColumns, photosReady, matchPhotoFile, get photoIds() { return [...PH.keys()]; }, get photoBackend() { return photoBackend; }, photoBlob: (id) => (PH.get(id) || {}).blob,
  sync: { get cfg() { return SY.cfg; }, get queue() { return [...SY.q.keys()]; }, get state() { return SY.state; }, get running() { return SY.running; }, now: syncNow, call: syncCall, status: syncStatusInfo, CODE_GS }, face: FACE_API };
})();

</script>
