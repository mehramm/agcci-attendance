<style>
:root{
  --brand:#6A1B9A;--brand-2:#C2185B;--brand-3:#3B0F5C;--gold:#F4B400;--gold-2:#FFD54F;
  --bg:#FAF7FC;--surface:#FFFFFF;--surface-2:#F4EEF8;--text:#1F1430;--muted:#6E6180;--border:#E9E0F1;
  --brand-text:#6A1B9A;--shadow:0 1px 2px rgba(59,15,92,.06),0 6px 20px rgba(59,15,92,.06);
  --shadow-lg:0 20px 50px rgba(59,15,92,.22);
  --p:#16A34A;--l:#D97706;--e:#2563EB;--a:#DC2626;--u:#8E84A0;
  --radius:18px;--ring:0 0 0 3px rgba(194,24,91,.28);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#130C1B;--surface:#1D1428;--surface-2:#271C35;--text:#F4EDFA;--muted:#A99CBB;--border:#342648;
    --brand-text:#D7A6F5;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--shadow-lg:0 24px 60px rgba(0,0,0,.55);
    --p:#22C55E;--l:#F59E0B;--e:#60A5FA;--a:#F87171;--u:#8E84A0;color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --bg:#130C1B;--surface:#1D1428;--surface-2:#271C35;--text:#F4EDFA;--muted:#A99CBB;--border:#342648;
  --brand-text:#D7A6F5;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--shadow-lg:0 24px 60px rgba(0,0,0,.55);
  --p:#22C55E;--l:#F59E0B;--e:#60A5FA;--a:#F87171;--u:#8E84A0;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:clamp(14.5px,13.4px + .18vw,16.5px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;background:var(--bg);color:var(--text);line-height:1.45;font-size:1rem;-webkit-font-smoothing:antialiased}
a{color:var(--brand-text)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.2;margin:0;overflow-wrap:break-word;min-width:0}
h1{font-size:1.6rem;letter-spacing:-.02em}
h2{font-size:1.15rem;letter-spacing:-.01em}
h3{font-size:1rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}
.ic.lg{width:28px;height:28px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* layout */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.sidebar{position:sticky;top:0;height:100vh;height:100dvh;background:linear-gradient(170deg,#2E0A49 0%,#5B1785 55%,#8E1A6E 100%);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;text-decoration:none;color:inherit}
.brand .logo{width:42px;height:42px;flex:none}
.brand b{display:block;font-size:1.05rem;letter-spacing:.02em}
.brand span{display:block;font-size:.72rem;opacity:.78;line-height:1.25;max-width:160px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:rgba(255,255,255,.8);text-decoration:none;font-weight:600;transition:background .15s,color .15s}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.active{background:rgba(255,255,255,.15);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav a.cta{margin:6px 0;background:linear-gradient(135deg,var(--gold),#FF9F1C);color:#2E0A49}
.nav a.cta.active{box-shadow:0 0 0 2px #fff inset}
.side-foot{margin-top:auto;font-size:.75rem;opacity:.75;padding:10px 8px;display:flex;flex-direction:column;gap:8px}
.main-wrap{min-width:0;display:flex;flex-direction:column;--pad-x:clamp(14px,2.4vw,32px);--main-max:1320px;--topbar-h:69px}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) max(var(--pad-x),env(safe-area-inset-right)) 12px var(--pad-x);background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topbar .m-brand{display:none;align-items:center;justify-content:center;min-width:44px;gap:10px;text-decoration:none;color:var(--text);font-weight:800;min-height:44px}
.topbar .m-brand .logo{width:34px;height:34px}
.search{position:relative;flex:1;max-width:460px}
.search input,.search input[type=search]{width:100%;height:44px;border-radius:14px;border:1px solid var(--border);background:var(--surface);padding:0 14px 0 42px;outline:none;transition:box-shadow .15s,border-color .15s}
.search input:focus{border-color:var(--brand-2);box-shadow:var(--ring)}
.search>.ic{position:absolute;left:13px;top:12px;color:var(--muted)}
.search kbd{position:absolute;right:10px;top:11px;font-size:.72rem;border:1px solid var(--border);border-radius:6px;padding:1px 6px;color:var(--muted);background:var(--surface-2)}
.results{position:absolute;top:50px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;max-height:60vh;overflow-y:auto;z-index:40}
.results button{display:flex;width:100%;align-items:center;gap:12px;padding:10px 14px;border:0;background:none;text-align:left;cursor:pointer}
.results button:hover,.results button.hl{background:var(--surface-2)}
.results .empty{padding:14px;color:var(--muted)}
.top-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;color:var(--text);transition:transform .1s,background .15s}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:active{transform:scale(.94)}
.search-toggle,.settings-link{display:none!important}
.date-med{display:none}
main{padding:clamp(14px,2.2vw,28px) max(var(--pad-x),env(safe-area-inset-right)) 60px var(--pad-x);max-width:var(--main-max);width:100%;margin:0 auto;container:main/inline-size}
.bottomnav{display:none}
.sample-pill{display:inline-flex;align-items:center;min-height:40px;padding:0 2px;background:none;border:0;cursor:pointer}
.sp-in{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#2E0A49;font-weight:800;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;white-space:nowrap}

/* banner */
#banner{width:100%;max-width:var(--main-max);margin:0 auto}
#banner:empty{display:none}
.banner{margin:14px max(var(--pad-x),env(safe-area-inset-right)) 0 var(--pad-x);flex-wrap:wrap;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-radius:14px;background:linear-gradient(90deg,rgba(244,180,0,.18),rgba(194,24,91,.10));border:1px solid rgba(244,180,0,.45);animation:slideDown .35s ease}
.banner .ic{color:#B7791F}
.banner p{margin:0;flex:1 1 220px;font-weight:600;min-width:0}
.banner .btn{min-height:40px}

/* generic */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{margin:4px 0 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-weight:650;cursor:pointer;text-decoration:none;color:var(--text);white-space:nowrap;max-width:100%;transition:transform .1s ease,box-shadow .15s,background .15s,opacity .15s;user-select:none;-webkit-tap-highlight-color:transparent}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.icon-btn:focus-visible,.seg button:focus-visible,.bigbtn:focus-visible{outline:none;box-shadow:var(--ring)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(194,24,91,.25)}
.btn-primary:hover{background:linear-gradient(135deg,#7B22B2,#D81B60);}
.btn-gold{background:linear-gradient(135deg,var(--gold),#FF9F1C);color:#2E0A49;border-color:transparent}
.btn-gold:hover{background:linear-gradient(135deg,#FFC107,#FF8F00)}
.btn-danger{background:var(--a);color:#fff;border-color:transparent}
.btn-danger:hover{background:#B91C1C}
.btn-ghost{background:transparent;border-color:transparent}
.btn-soft{background:var(--surface-2);border-color:transparent}
.btn-sm{min-height:40px;padding:0 12px;font-size:.88rem;border-radius:10px}
.btn-lg{min-height:56px;padding:0 24px;font-size:1.05rem;border-radius:16px}
.btn-block{width:100%}
.link{background:none;border:0;padding:0;color:var(--brand-text);font-weight:650;cursor:pointer;text-decoration:underline;text-underline-offset:3px;display:inline-flex;align-items:center;min-height:40px}
input[type=text],input[type=url],input[type=search],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=number],select,textarea{height:44px;max-width:100%;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding:0 12px;outline:none;min-width:0;transition:box-shadow .15s,border-color .15s}
textarea{height:auto;padding:12px;resize:vertical;width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9rem}
input:focus,select:focus,textarea:focus{border-color:var(--brand-2);box-shadow:var(--ring)}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.88rem}
label.field input,label.field select{width:100%}
.field-hint{font-weight:400;color:var(--muted);font-size:.8rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip-btn{min-height:40px;text-align:left;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.chip-btn .n{font-size:.75rem;opacity:.7}
.chip-btn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--surface-2);color:var(--brand-text);max-width:100%;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:52px;padding:3px 9px;border-radius:999px;font-size:.8rem;font-weight:800;color:var(--c,var(--muted));background:color-mix(in srgb,var(--c,var(--muted)) 14%,transparent)}
.st-p{--c:var(--p)}.st-l{--c:var(--l)}.st-e{--c:var(--e)}.st-a{--c:var(--a)}.st-u{--c:var(--u)}
.rate-good{--c:var(--p)}.rate-mid{--c:var(--l)}.rate-bad{--c:var(--a)}.rate-none{--c:var(--u)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:.9rem;letter-spacing:.02em}
.avatar.xl{width:84px;height:84px;font-size:1.8rem}
.avatar.lg{width:64px;height:64px;font-size:1.35rem}
hr.sep{border:0;border-top:1px solid var(--border);margin:16px 0}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:26px;color:#fff;background:radial-gradient(circle at 90% 10%,rgba(244,180,0,.35),transparent 40%),linear-gradient(135deg,#3B0F5C,#6A1B9A 50%,#C2185B);box-shadow:var(--shadow-lg);display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.06)}
.hero h1{font-size:1.75rem}
.hero p{margin:6px 0 0;opacity:.88}
.hero .kente{display:flex;gap:4px;margin-top:14px}
.hero .kente i{width:22px;height:5px;border-radius:3px;background:var(--gold)}
.hero .kente i:nth-child(2){background:#fff;opacity:.7}.hero .kente i:nth-child(3){background:#FF6F91}.hero .kente i:nth-child(4){background:#22C55E}
.mark-cta{position:relative;z-index:1;display:flex;flex-direction:column;align-items:stretch;gap:8px;min-width:260px}
.mark-cta .btn{min-height:64px;font-size:1.12rem;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.mark-cta .done{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:12px 16px;font-weight:700;display:flex;align-items:center;gap:10px}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .k{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.stat .v{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.stat .s{font-size:.82rem;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px}
.chart .grid-l{stroke:var(--border);stroke-dasharray:3 4}
.bulk-row{display:flex;gap:8px;flex-wrap:wrap}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n p" "b b";gap:4px 10px;align-items:center;padding:7px 0}
.bar-row>:first-child{grid-area:n;min-width:0;overflow-wrap:break-word}.bar-row>.bar{grid-area:b}.bar-row>.pill{grid-area:p}
@container main (min-width:600px) and (max-width:1479px){.bar-row{grid-template-columns:minmax(120px,1fr) 2fr auto;grid-template-areas:"n b p";gap:10px}}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .6s ease}
.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border);min-width:0}
.list-item:last-child{border-bottom:0}
.list-item .nm{font-weight:700;overflow-wrap:anywhere}
.list-item .meta{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.list-item .body{flex:1;min-width:0}
.clickable{cursor:pointer;border-radius:12px;transition:background .12s}
.clickable:hover{background:var(--surface-2)}

/* empty state */
.empty-state{text-align:center;padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty-state .art{width:120px;height:120px}
.empty-state h2{font-size:1.4rem}
.empty-state p{max-width:520px;margin:0;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0;text-align:left;width:100%;max-width:760px}
.steps div{background:var(--surface-2);border-radius:14px;padding:14px;font-size:.9rem}
.steps b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;margin-right:6px;font-size:.8rem}

/* mark */
.mark-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;min-height:40px;padding:0 12px;border-radius:9px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--muted);transition:all .15s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.count{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 25%,transparent);font-weight:700;font-size:.9rem}
.count b{font-size:1.15rem;color:var(--c)}
.progress{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;display:flex}
.progress i{display:block;height:100%;transition:width .35s ease}
.stage{max-width:560px;margin:0 auto}
.card-nav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px;font-weight:700;color:var(--muted)}
.scard{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:34px 22px 28px;text-align:center;box-shadow:var(--shadow-lg);touch-action:pan-y;user-select:none;animation:cardIn .28s cubic-bezier(.2,.8,.2,1);transition:transform .05s linear}
.scard .avatar{margin:0 auto 14px}
.scard .nm{font-size:clamp(1.6rem,6vw,2.3rem);font-weight:850;letter-spacing:-.02em;line-height:1.15;word-break:break-word}
.scard .sub{margin-top:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.scard .cur{margin-top:14px}
.scard .swipe-hint{position:absolute;top:14px;font-weight:900;font-size:.9rem;letter-spacing:.08em;opacity:0;transition:opacity .1s;padding:4px 10px;border-radius:8px;border:2px solid currentColor}
.scard .swipe-hint.l{left:14px;color:var(--a);transform:rotate(-10deg)}
.scard .swipe-hint.r{right:14px;color:var(--p);transform:rotate(10deg)}
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.bigbtn{border:0;border-radius:20px;min-height:86px;font-size:1.25rem;font-weight:850;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 8px 20px color-mix(in srgb,var(--c) 35%,transparent);background:var(--c);transition:transform .1s,filter .15s;-webkit-tap-highlight-color:transparent}
.bigbtn:hover{filter:brightness(1.06)}
.bigbtn:active{transform:scale(.96)}
.bigbtn small{font-size:.72rem;font-weight:600;opacity:.85}
.bigbtn.sec{min-height:60px;font-size:1.02rem;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);box-shadow:none;border:1.5px solid color-mix(in srgb,var(--c) 35%,transparent)}
.bigbtn.cur{outline:3px solid var(--gold);outline-offset:2px}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap}
.kbd-hint{font-size:.78rem;color:var(--muted)}
.kbd-hint kbd{border:1px solid var(--border);border-radius:5px;padding:0 5px;background:var(--surface-2);font-size:.72rem}
.done-card{text-align:center;padding:30px 20px}
.done-card .big{font-size:3rem;line-height:1}
.srow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--border);transition:background .2s}
.srow:last-child{border-bottom:0}
.srow.flash{background:color-mix(in srgb,var(--gold) 16%,transparent)}
.srow .body{flex:1;min-width:0}
.srow .nm{font-weight:700;overflow-wrap:anywhere}
.srow a.body{color:inherit;text-decoration:none;min-height:44px;display:flex;flex-direction:column;justify-content:center;border-radius:10px}
.srow a.body:hover .nm{text-decoration:underline;text-underline-offset:3px}
.srow .meta{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}

.sticky-actions{position:sticky;bottom:12px;z-index:5;margin-top:16px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:10px;border-radius:16px;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--border);box-shadow:var(--shadow-lg)}

/* students */

details.panel{border:1px solid var(--border);border-radius:16px;background:var(--surface);margin-bottom:14px}

details.panel summary::-webkit-details-marker{display:none}
details.panel summary::after{content:"▾";margin-left:auto;transition:transform .2s;color:var(--muted)}
details.panel[open] summary::after{transform:rotate(180deg)}
details.panel .inner{padding:0 16px 14px}
.grp-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--border)}

/* profile */
.prof-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}

.contact{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:6px;font-size:.88rem;color:var(--muted)}
.contact a{overflow-wrap:anywhere;display:inline-flex;align-items:center;min-height:40px}
.contact span{min-width:0}
.contact span{display:inline-flex;align-items:center;gap:5px}
.ring{width:110px;height:110px}
.ring text{font-weight:850;fill:var(--text)}
.mini-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.mini{background:var(--surface-2);border-radius:14px;padding:12px}
.mini .v{font-size:1.45rem;font-weight:850;color:var(--c,var(--text))}
.mini .k{font-size:.75rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.cal-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:16px 24px}
.cal h3{font-size:.95rem;margin-bottom:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(2px,.6vw,4px)}
.cal-grid .dow{font-size:.68rem;color:var(--muted);text-align:center;font-weight:700}
.cal-grid button{aspect-ratio:1;min-height:40px;border-radius:9px;border:1px solid transparent;background:transparent;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--muted);padding:0;display:grid;place-items:center;transition:transform .1s}
.cal-grid button:hover{transform:scale(1.1);border-color:var(--border)}
.cal-grid button.sd{background:var(--surface-2);color:var(--text)}
.cal-grid button.has{background:var(--c);color:#fff}
.cal-grid button.def{background:repeating-linear-gradient(45deg,var(--c),var(--c) 4px,color-mix(in srgb,var(--c) 70%,#fff) 4px,color-mix(in srgb,var(--c) 70%,#fff) 8px)}
.cal-grid button.today{outline:2px solid var(--gold);outline-offset:1px}
.cal-grid button:disabled{opacity:.35;cursor:default;transform:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--c);vertical-align:-2px;margin-right:5px}
.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);font-size:.9rem}
.table th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.table-wrap{overflow-x:auto}

/* history */
.hist{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
.sess-list{max-height:calc(100vh - var(--topbar-h) - 40px);overflow:auto;position:sticky;top:calc(var(--topbar-h) + 16px)}
.sess{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;cursor:pointer;border:1px solid transparent;width:100%;background:none;text-align:left}
.sess:hover{background:var(--surface-2)}
.sess.on{background:color-mix(in srgb,var(--brand) 10%,var(--surface));border-color:color-mix(in srgb,var(--brand) 35%,transparent)}
.sess .d{font-weight:700}
.sess .bar{flex:1;height:6px}
.date-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* modal */
.modal-back{position:fixed;inset:0;z-index:100;background:rgba(20,8,30,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px;animation:fadeIn .18s ease}
.modal{background:var(--surface);color:var(--text);border-radius:22px;width:100%;max-width:560px;max-height:calc(100vh - 36px);max-height:calc(100dvh - 36px);overflow:auto;overscroll-behavior:contain;box-shadow:var(--shadow-lg);animation:popIn .22s cubic-bezier(.2,.8,.2,1)}
.modal.wide{max-width:820px}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 20px 10px;position:sticky;top:0;background:var(--surface);z-index:2}
.modal-h h2{flex:1}
.modal-b{padding:6px 20px 16px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px 18px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border)}
.drop{border:2px dashed color-mix(in srgb,var(--brand) 40%,var(--border));border-radius:16px;padding:26px;text-align:center;cursor:pointer;transition:all .15s;background:var(--surface-2)}
.drop.over,.drop:hover{border-color:var(--brand-2);background:color-mix(in srgb,var(--brand-2) 8%,var(--surface))}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border)}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brand-text);border-color:var(--brand-2)}
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.preview{max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:12px}
.preview table{width:100%;border-collapse:collapse;font-size:.85rem}
.preview th,.preview td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
.preview th{position:sticky;top:0;background:var(--surface-2)}
.preview tr.dup td{opacity:.5;text-decoration:line-through}
.status-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.status-pick .bigbtn{min-height:64px;font-size:1.05rem}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;min-height:44px;flex-wrap:wrap}
.switch input{width:22px;height:22px;accent-color:var(--brand-2)}
.day-chips{display:flex;gap:6px;flex-wrap:wrap}
.day-chips label{position:relative}
.day-chips input{position:absolute;opacity:0}
.day-chips span{display:inline-grid;place-items:center;min-width:52px;height:44px;border-radius:12px;border:1.5px solid var(--border);font-weight:700;cursor:pointer;transition:all .15s;background:var(--surface)}
.day-chips input:checked+span{background:var(--brand);border-color:var(--brand);color:#fff}
.day-chips input:focus-visible+span{box-shadow:var(--ring)}
.set-sec{display:flex;flex-direction:column;gap:14px}

/* toasts */
#toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(94vw,480px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:#24163A;color:#fff;padding:12px 14px 12px 16px;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.3);font-weight:600;animation:toastIn .28s cubic-bezier(.2,.8,.2,1);width:100%;border-left:4px solid var(--gold)}
.toast.success{border-left-color:#22C55E}.toast.error{border-left-color:#F87171}
.toast .msg{flex:1}
.toast button{background:rgba(255,255,255,.14);border:0;color:#fff;font-weight:800;padding:7px 12px;min-height:40px;border-radius:9px;cursor:pointer}
.toast.out{animation:toastOut .22s ease forwards}

@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}
@keyframes pulse{0%,100%{box-shadow:0 10px 30px rgba(0,0,0,.25),0 0 0 0 rgba(244,180,0,.6)}50%{box-shadow:0 10px 30px rgba(0,0,0,.25),0 0 0 10px rgba(244,180,0,0)}}
.pulse{animation:pulse 2.2s infinite}
.fade-in{animation:fadeIn .25s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@container main (max-width:1060px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.hist{grid-template-columns:260px minmax(0,1fr)}}
@container main (max-width:760px){
  .dash-grid{grid-template-columns:minmax(0,1fr)}
  .dash-grid>*{grid-column:auto!important}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .hist{grid-template-columns:minmax(0,1fr)}
  .sess-list{position:static;max-height:none;order:2}
  .steps{grid-template-columns:1fr}
  .hero{padding:20px;border-radius:20px}
  .mark-cta{min-width:0;width:100%}
  .bulk-row{display:grid;grid-template-columns:1fr 1fr;width:100%}
  .bulk-row .btn{white-space:normal;line-height:1.15;font-size:.82rem;padding:4px 8px}
  .mark-top{gap:8px}
  .mark-top .date-nav{flex:1 1 220px;flex-wrap:nowrap}
  .mark-top #mark-date{flex:1;min-width:0}
  .mark-top .grp-sel{flex:1 1 160px}
  .count{padding:5px 8px;font-size:.8rem;gap:5px;border-radius:10px}
  .count b{font-size:1rem}
  .srow{padding:10px 6px;gap:8px}
  .date-nav input[type=date]{flex:1 1 140px;min-width:140px}
  .date-nav .h-title{flex:1 1 100%;order:9}
  .date-nav .grow{display:none}
}
@container main (max-width:560px){
  .btn{white-space:normal;line-height:1.2}
  .card{padding:14px}
  .prof-head{gap:12px}
  .prof-head .avatar.xl{width:64px;height:64px;font-size:1.35rem}
  .ring{width:88px;height:88px}
  .stu-row .avatar:not(.photo){display:none}
  .table.reflow thead{display:none}
  .table.reflow tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,auto);gap:4px 10px;padding:10px 2px;border-bottom:1px solid var(--border)}
  .table.reflow td{border:0;padding:0}
  .table.reflow td.td-sel{grid-column:2;grid-row:1/span 2;align-self:center}
  .table.reflow td.td-sel select{width:100%}
  .today-pill{display:none}
}
@container main (max-width:440px){
  .srow{flex-wrap:wrap}
  .srow .avatar:not(.photo){display:none}
  .srow a.body{flex:1 1 100%;min-height:40px}
  .srow .avatar.photo+a.body{flex:1 1 0;min-width:0}
  .srow .sseg{width:100%;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
  .srow .sseg button{min-width:0;height:44px}
  .stat .v{font-size:1.5rem}
  .stat{padding:14px}
}
@container main (max-width:330px){
  .cal-card{margin-inline:calc(-1 * var(--pad-x));border-radius:0;border-inline:0;padding-inline:6px}
  .g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
}
@container main (min-width:1300px){
  .stu-list{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
  .stu-list>.sel-all{grid-column:1/-1}
  #h-rows,#mark-rows{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}
  #h-rows .srow:nth-last-child(2):nth-child(odd),#mark-rows .srow:nth-last-child(2):nth-child(odd){border-bottom:0}
}
@container main (min-width:1400px){
  .reports-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@container main (min-width:1480px){
  .dash-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .dg-trend{grid-column:span 2}.dg-attn,.dg-groups{grid-column:span 1}.dg-recent{grid-column:1/-1}
  .recent-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .recent-list .list-item{border:1px solid var(--border);border-radius:14px;padding:12px}
  .recent-list .list-item:nth-child(n+7){display:flex}
}
/* modals are outside <main>: size by viewport */
@media (max-width:560px){.modal .btn{white-space:normal}.modal-f .btn{flex:1 1 auto}.map-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (hover:none){.bigbtn small{display:none}}
@keyframes sheetIn{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media print{.sidebar,.topbar,.bottomnav,#banner,.no-print{display:none!important}.app{display:block}main{padding:0}.card{box-shadow:none}}

/* responsive pass: tap-target & calendar fixes */
.srow .body{min-height:44px;display:flex;flex-direction:column;justify-content:center}
.cal-grid{grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-grid button{min-width:0;width:100%}
/* responsive pass: narrow phone topbar + toast wrapping */
.topbar .top-actions{min-width:0}
.toast{flex-wrap:wrap}
.toast .msg{flex:1 1 160px;min-width:0;overflow-wrap:anywhere}
.toast button{margin-left:auto}
@media (max-width:399px){
  [data-layout=phone] .topbar .m-brand span:not(.logo){display:none}
  [data-layout=phone] .topbar .top-actions{gap:4px}
  [data-layout=phone] .sp-in{padding:4px 8px;letter-spacing:.03em}
}
@media (max-width:339px){
  [data-layout=phone] .sp-in svg{display:none}
}
/* compact (phone / short landscape) marking: no key hints, one-row counters */
.mark-compact .bigbtn small,.mark-compact .kbd-hint{display:none}
.short .mark-compact .counts{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.short main{padding-bottom:max(12px,env(safe-area-inset-bottom))}

/* ============ photos ============ */
.avatar.photo{background:var(--surface-2);overflow:hidden;padding:0}
.avatar.photo img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.avatar.xl.photo{border-radius:22px}
.card-photo{display:block;margin:0 auto 12px;padding:0;border:0;background:var(--surface-2);cursor:zoom-in;border-radius:24px;width:clamp(132px,26vh,230px);aspect-ratio:1;overflow:hidden;box-shadow:0 10px 28px rgba(40,10,60,.22);touch-action:pan-y;flex:none}
.card-photo img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none;user-select:none}
.card-photo:focus-visible{outline:none;box-shadow:var(--ring)}
/* phone portrait (compact): photo beside the name on shorter screens, big and centred on tall ones */
.mark-compact .scard.has-photo{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"ph nm" "ph sub" "ph cur";column-gap:14px;text-align:left;align-items:center;align-content:center}
.mark-compact .scard.has-photo .card-photo{grid-area:ph;margin:0;width:clamp(92px,19vh,150px);border-radius:18px}
.mark-compact .scard.has-photo .nm{grid-area:nm;align-self:end}
.mark-compact .scard.has-photo .sub{grid-area:sub;justify-content:flex-start;align-self:start}
.mark-compact .scard.has-photo .cur{grid-area:cur}
@media (min-height:721px){
  [data-layout=phone] .mark-compact .scard.has-photo{display:block;text-align:center}
  [data-layout=phone] .mark-compact .scard.has-photo .card-photo{margin:0 auto 10px;width:min(48vw,24vh,240px);border-radius:22px}
  [data-layout=phone] .mark-compact .scard.has-photo .sub{justify-content:center}
}
.short .mark-compact .scard.has-photo{display:grid;padding:10px 12px}
.short .mark-compact .scard.has-photo .card-photo{width:clamp(64px,30vh,132px);border-radius:14px}
/* profile */
.prof-photo{position:relative;padding:0;border:0;background:none;cursor:pointer;border-radius:22px;flex:none}
.prof-photo .avatar.xl:not(.photo){border-radius:50%}
.prof-photo .pp-badge{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;border-radius:50%;background:var(--surface);border:2px solid var(--border);display:grid;place-items:center;color:var(--brand-text);box-shadow:var(--shadow)}
.prof-photo:focus-visible{outline:none;box-shadow:var(--ring)}
/* modals: square stage used by crop editor and camera */
.photo-modal .modal-b{align-items:stretch}
.sq-stage{position:relative;width:min(100%,380px,calc(100dvh - 300px));min-width:200px;aspect-ratio:1;margin:0 auto;border-radius:18px;overflow:hidden;background:#111;touch-action:none;user-select:none}
.short .sq-stage{width:min(100%,calc(100dvh - 190px));min-width:150px}
.sq-stage canvas,.sq-stage video{position:absolute;inset:0;width:100%;height:100%;display:block}
.sq-stage video{object-fit:cover}
.sq-stage video.mirror{transform:scaleX(-1)}
.crop-stage{cursor:grab}.crop-stage:active{cursor:grabbing}
.sq-guide{position:absolute;inset:0;pointer-events:none;border:2px solid rgba(255,255,255,.85);border-radius:18px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.sq-guide::before{content:"";position:absolute;inset:12%;border-radius:50%;border:1.5px dashed rgba(255,255,255,.55)}
.sq-guide::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)) 33.33% 0/1px 100% no-repeat,linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)) 66.66% 0/1px 100% no-repeat,linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)) 0 33.33%/100% 1px no-repeat,linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)) 0 66.66%/100% 1px no-repeat}
.crop-tools{display:flex;align-items:center;gap:8px;justify-content:center;max-width:380px;margin:0 auto;width:100%}
.crop-tools input[type=range]{flex:1;min-width:0;accent-color:var(--brand);height:44px}
.crop-hint{margin:0;text-align:center}
.cam-msg{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;color:#fff;text-align:center;padding:18px;font-weight:600;background:rgba(0,0,0,.35)}
.cam-msg[hidden]{display:none}
.cam-bar{display:flex;align-items:center;justify-content:center;gap:28px}
.cam-bar[hidden]{display:none}
.cam-bar .icon-btn{width:48px;height:48px}
.shutter{width:68px;height:68px;border-radius:50%;border:5px solid var(--brand);background:#fff;box-shadow:0 0 0 3px var(--surface),0 6px 18px rgba(0,0,0,.25);cursor:pointer;flex:none}
.shutter:disabled{opacity:.4;cursor:default}
.shutter:active{transform:scale(.94)}
.photo-big{display:block;width:min(100%,440px,calc(100dvh - 190px));aspect-ratio:1;object-fit:cover;border-radius:18px;margin:0 auto;background:var(--surface-2)}
.lightbox .modal-f{justify-content:center}
.pm{display:flex;flex-direction:column;gap:14px;align-items:center}
.pm .photo-big{width:min(100%,300px,calc(100dvh - 330px));min-width:140px}
.pm-prev{text-align:center}
.pm-avatar{width:120px;height:120px;font-size:2.4rem;margin:0 auto}
.pm-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
/* photo field in add/edit student */
.photo-field{display:flex;gap:14px;align-items:center;padding:10px;border:1px dashed var(--border);border-radius:14px;background:var(--surface-2)}
.photo-field .avatar.lg.photo{border-radius:16px}
.pf-empty{background:var(--surface)!important;color:var(--muted);border:1px solid var(--border)}
.pf-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pf-label{font-weight:700;font-size:.9rem}
.pf-label .field-hint{display:block}
.pf-btns{display:flex;flex-wrap:wrap;gap:6px}
.pf-btns [hidden]{display:none}
/* bulk import preview */
.bp-sum{font-size:.9rem;margin:2px 0 8px}
.bp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.bp-item{display:flex;gap:12px;padding:10px;border:1px solid var(--border);border-radius:14px;background:var(--surface);align-items:flex-start;min-width:0}
.bp-item.miss{border-color:color-mix(in srgb,var(--a) 45%,var(--border));background:color-mix(in srgb,var(--a) 5%,var(--surface))}
.bp-thumb{width:76px;height:76px;border-radius:14px;overflow:hidden;flex:none;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.bp-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.bp-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.bp-file{font-weight:700;font-size:.88rem;overflow-wrap:anywhere}
.bp-info .pill{white-space:normal;text-align:left;line-height:1.25}
.bp-ctl{display:flex;gap:6px;width:100%;flex-wrap:wrap}
.bp-ctl select{flex:1 1 150px;min-width:0;height:40px}

[hidden]{display:none!important}

/* ============ absence reasons & notes ============ */
.rchip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--a) 30%,var(--border));background:var(--surface);color:var(--text);font-weight:650;font-size:.88rem;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;flex:none;transition:background .12s,border-color .12s}
.rchip:hover{border-color:var(--a)}
.rchip.on{background:var(--a);border-color:var(--a);color:#fff}
.rchip.ghost{border-style:dashed;border-color:var(--border);color:var(--muted)}
.rchip:focus-visible{outline:none;box-shadow:var(--ring)}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
/* card mode: the strip takes the place of the Back/Skip row so the layout height doesn't change */
.reason-strip{display:flex;align-items:center;gap:8px;margin:14px 0 10px;min-width:0;height:40px;animation:fadeIn .18s ease}
.reason-strip .rs-q{flex:none;display:flex;flex-direction:column;line-height:1.1;font-size:.8rem;color:var(--muted);max-width:92px;overflow-wrap:anywhere}
.reason-strip .rs-q b{color:var(--text);font-size:.86rem}
.reason-strip .rs-chips{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:0;height:40px;align-items:center;mask-image:linear-gradient(90deg,#000 88%,transparent)}
.reason-strip .rchip:focus-visible{box-shadow:inset 0 0 0 2px var(--brand)}
.reason-strip .rs-chips::-webkit-scrollbar{display:none}
.reason-strip .rs-x{flex:none;width:40px;height:40px}
.mark-compact .reason-strip{margin:6px 0}
.mark-view:not(.mark-compact) .reason-strip{margin-top:10px}
.short .mark-compact .reason-strip{grid-area:nav;margin:4px 0}
.done-card~.reason-strip,.stage>.reason-strip+.done-card{margin-top:0}
/* list / history rows */
.srow{flex-wrap:wrap}
.srow .reason-row{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:2px 0 4px;animation:fadeIn .15s ease}
.srow .reason-row .rr-q{margin-right:2px}
.srow .meta .why{color:var(--a);font-weight:700}
.srow .meta .rnote{font-style:italic}
.sseg button.rec{min-width:40px;width:40px;color:var(--muted);border-style:dashed;display:inline-grid;place-items:center}
.sseg button.rec.has{border-style:solid;color:var(--brand);border-color:color-mix(in srgb,var(--brand) 45%,transparent)}
@container main (max-width:440px){.srow .sseg button.rec{width:auto}}
/* record dialog */
.rec-dlg{display:grid;gap:12px}
.rec-dlg .rd-status{display:flex;flex-wrap:wrap;width:100%}
.rec-dlg .rd-status button{flex:1 1 0;justify-content:center}
.rec-dlg .rd-status button.on{background:var(--c);color:#fff}
.rec-dlg #rd-other{margin-top:8px}
/* profile */
.pe-reason:not(:empty){margin-top:12px;display:grid;gap:6px}
.pe-note{margin-top:4px}
.prof-grid{align-items:start}
.note-add{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start}
.note-add textarea{grid-column:1/-1;resize:vertical;min-height:64px}
.note-add button{grid-column:2;justify-self:end}
.notes-list{margin-top:12px;display:grid;gap:8px}
.note-item{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2)}
.note-main{flex:1;min-width:0}
.note-d{font-size:.76rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.note-t{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.note-acts{display:flex;gap:4px;flex:none}
.note-acts .icon-btn{width:40px;height:40px}
.td-sel-in{display:inline-flex;gap:6px;align-items:center;justify-content:flex-end}
.td-sel-in .icon-btn{width:40px;height:40px;flex:none}
.td-reason{color:var(--a);font-weight:650}
.td-note{font-size:.88rem;overflow-wrap:anywhere;max-width:260px}
@container main (max-width:760px){
  .table.reflow td.td-reason,.table.reflow td.td-note{grid-column:1/-1;max-width:none}
  .table.reflow td.empty{display:none}
  .table.reflow td.td-reason::before{content:'Reason: ';color:var(--muted);font-weight:500}
  .table.reflow td.td-note::before{content:'Note: ';color:var(--muted)}
  .table.reflow td.td-sel .td-sel-in{display:flex;width:100%}
  .table.reflow td.td-sel .td-sel-in select{flex:1;min-width:0}
}
/* reasons bars */
.rs-bars{display:grid;gap:6px}
.rs-row{display:grid;grid-template-columns:minmax(80px,max-content) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.9rem}
.rs-row .rs-l{overflow-wrap:anywhere}
.rs-row .bar i{background:linear-gradient(90deg,var(--a),color-mix(in srgb,var(--a) 60%,var(--gold)))}
.rs-row .rs-n{min-width:2ch;text-align:right}
.rs-flags{margin-top:12px;border-top:1px solid var(--border);padding-top:8px}
.rs-flags h3{font-size:.9rem;margin:0 0 4px;display:flex;align-items:center;gap:6px;color:var(--l)}
.rs-flags .list-item{text-decoration:none;color:inherit}
.dg-reasons{grid-column:span 2}.dash-grid .dg-groups{grid-column:span 2}.dash-grid .dg-recent{grid-column:span 2}
@container main (min-width:1480px){.dash-grid .dg-groups,.dash-grid .dg-reasons{grid-column:span 1}.dash-grid .dg-recent{grid-column:span 3}}

/* ============ printable report: controls + live preview ============ */
.rp-card{margin-bottom:16px}
.rp-layout{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:18px;align-items:start}
@container main (max-width:900px){.rp-layout{grid-template-columns:minmax(0,1fr)}}
.rp-ctl{display:grid;gap:12px;min-width:0}
.rp-types{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.rp-types .chip-btn{flex:1 1 auto;justify-content:center;text-align:center}
.rp-fields{display:grid;gap:8px}
.rp-fields .date-nav{flex-wrap:nowrap}
.rp-fields .date-nav input{flex:1;min-width:0}
.rp-range{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rp-range input{min-width:0;width:100%}
.rp-btns .btn{flex:1 1 auto;justify-content:center}
.rp-help{font-size:.88rem;border:1px solid var(--border);border-radius:12px;padding:0 12px}
.rp-help summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.rp-help ul{padding-left:18px;margin:6px 0}
.rp-help li{margin:4px 0}
.rp-prev-wrap{min-width:0}
.rp-prev-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.rp-preview{background:var(--surface-2);border-radius:14px;padding:10px;overflow:hidden}
.rp-paper{width:794px;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18);transform-origin:0 0}
.rp-paper .rpt{padding:14mm 12mm}
/* settings */
.reason-list{display:grid;gap:6px;margin-top:6px}
.reason-item{display:flex;gap:6px;align-items:center}
.reason-item input{flex:1;min-width:0}
.reason-item .icon-btn{width:40px;height:40px;flex:none;font-size:.7rem}
.reason-add{margin-top:8px}
.reason-add input{min-width:0}
.logo-row{align-items:center}
.logo-prev{width:56px;height:56px;border-radius:14px;border:1px solid var(--border);display:grid;place-items:center;overflow:hidden;background:#fff;flex:none}
.logo-prev img,.logo-prev svg{width:100%;height:100%;object-fit:contain}

/* ============ the report document (same markup for preview and print; always light) ============ */
#print-root{display:none}
.rpt{--ink:#1D1B22;--muted:#6B6475;--line:#DDD6E3;--soft:#F6F2F9;--brand:#5B1785;color:var(--ink);background:#fff;font:10.5px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;text-align:left}
.rpt h1,.rpt h2,.rpt p{margin:0}
.rpt .muted{color:var(--muted)}
.rpt .small{font-size:9px}
.rpt .bad{color:#C62828}
.rpt-head{display:flex;gap:14px;align-items:flex-start;border-top:4px solid var(--brand);padding-top:10px;position:relative}
.rpt-head::before{content:'';position:absolute;top:-4px;right:0;width:28%;height:4px;background:#F4B400}
.rpt-logo{min-width:58px;max-width:130px;height:58px;flex:none;display:grid;place-items:center start}
.rpt-logo svg{width:58px;height:58px}
.rpt-logo img{width:auto;height:auto;max-width:130px;max-height:58px;object-fit:contain}
.rpt-hd{flex:1;min-width:0}
.rpt-org{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rpt-head h1{font-size:22px;line-height:1.15;margin:3px 0 4px;color:var(--ink)}
.rpt-sub{font-size:11px}
.rpt-addr{flex:0 1 200px;text-align:right;font-size:9px;color:var(--muted);overflow-wrap:anywhere}
.rpt-sample{margin-top:10px;background:#FFF4CC;color:#7A5A00;font-weight:800;text-align:center;border-radius:6px;padding:5px;font-size:10px;letter-spacing:.02em}
.rpt-stats{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;margin:14px 0}
.rpt-stat{background:var(--soft);border-radius:8px;padding:8px 4px;text-align:center}
.rpt-stat .v{font-size:20px;font-weight:800;line-height:1.1}
.rpt-stat .k{font-size:9px;color:var(--muted)}
.rpt-stat.st-P .v{color:#1E8E3E}.rpt-stat.st-L .v{color:#B26A00}.rpt-stat.st-E .v{color:#1565C0}.rpt-stat.st-A .v{color:#C62828}
.rpt-stat.rb-good .v{color:#1E8E3E}.rpt-stat.rb-mid .v{color:#B26A00}.rpt-stat.rb-bad .v{color:#C62828}
.rpt-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 14px}
.rpt-two>.rpt-box:only-child{grid-column:1/-1}
.rpt-box{border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;break-inside:avoid}
.rpt-box h2,.rpt-sec h2{font-size:12px;color:var(--brand);margin:0 0 6px;break-after:avoid}
.rpt-sec h2{font-size:13.5px}
.rpt-box p{margin:4px 0 0}
.rpt-chart{display:block;width:100%;height:auto}
.rpt-legend{display:flex;gap:10px;font-size:9px;color:var(--muted);margin-top:4px}
.rpt-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.rpt table{width:100%;border-collapse:collapse}
.rpt th{font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;background:var(--soft);padding:5px 6px;font-weight:800}
.rpt td{padding:5px 6px;border-bottom:1px solid #EEE8F2;vertical-align:middle;overflow-wrap:anywhere}
.rpt .n{text-align:right;white-space:nowrap}
.rpt td.nm{font-weight:700}
.rpt td .sub{font-weight:400;font-size:9px;color:var(--muted)}
.rpt td.note{font-size:9.5px;color:#3d3846}
.rpt-table tbody tr:nth-child(even) td{background:#FBF9FC}
.rpt-mini td,.rpt-mini th{padding:4px 5px}
.rpt-sec{margin:0 0 14px}
.rpt thead{display:table-header-group}
.rpt tr{break-inside:avoid;page-break-inside:avoid}
.rpt-ph{width:30px;padding:3px 4px!important}
.rpt-ph img,.rpt-ini{width:26px;height:26px;border-radius:50%;object-fit:cover;display:grid;place-items:center;color:#fff;font-size:9px;font-weight:800}
.rpt-reg td.sig,.rpt-reg th.sig{width:110px}
.rpt-reg td.sig{border-bottom:1px solid #999}
.rpt-reg td{padding-top:8px;padding-bottom:8px}
.rb,.rs{display:inline-block;padding:1px 7px;border-radius:999px;font-size:9px;font-weight:800;white-space:nowrap}
.rb-good,.rs-P{background:#E6F4EA;color:#1E8E3E}.rb-mid,.rs-L{background:#FFF1DB;color:#B26A00}.rb-bad,.rs-A{background:#FDE7E7;color:#C62828}.rs-E{background:#E3EEFB;color:#1565C0}.rb-none,.rs-U{background:#EEE;color:#777}
.rpt-list{list-style:none;margin:0;padding:0}
.rpt-list li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid #F1ECF5}
.rpt-bars{display:grid;gap:4px}
.rpt-bar{display:grid;grid-template-columns:88px 1fr 22px;gap:8px;align-items:center}
.rpt-bar i{display:block;height:8px;background:#F1ECF5;border-radius:4px;overflow:hidden}
.rpt-bar i b{display:block;height:100%;background:#C62828;border-radius:4px}
.rpt-bar em{font-style:normal;font-weight:800;text-align:right}
.rpt-sign{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:26px 0 10px}
.rpt-sign div{display:flex;flex-direction:column-reverse;gap:3px}
.rpt-sign b{border-bottom:1px solid #888;min-height:20px;font-size:12px;padding-bottom:2px}
.rpt-sign span{font-size:9px;color:var(--muted)}
.rpt-keep{break-inside:avoid;page-break-inside:avoid}
.rpt-foot-note{font-size:8.5px;color:var(--muted);margin-top:6px!important}
@media print{
  html.print-report,html.print-report body{background:#fff!important;color:#000}
  html.print-report body>*:not(#print-root){display:none!important}
  html.print-report #print-root{display:block}
  html.print-report .rpt{padding:0}
}
.flag-meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:2px}
textarea{font:inherit}
.reason-add{flex-wrap:wrap}.reason-add input{flex:1 1 180px}
.reason-list .reason-item input{min-width:0;width:auto;flex:1 1 0}
.reason-list .reason-item{min-width:0}
textarea{height:auto;min-height:64px;padding:10px 12px;line-height:1.4;resize:vertical}
/* ============ Google Sheets sync ============ */
.sync-st{display:inline-flex;align-items:center;gap:6px;height:44px;min-width:44px;padding:0 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--c,var(--muted));font:inherit;font-size:.82rem;font-weight:750;cursor:pointer;white-space:nowrap;position:relative;-webkit-tap-highlight-color:transparent}
.sync-st:hover{background:var(--surface-2)}
.sync-st:focus-visible{outline:none;box-shadow:var(--ring)}
.sync-st .ic{flex:none}
.sy-ok{--c:var(--p)}.sy-busy{--c:var(--e)}.sy-pend{--c:var(--e)}.sy-off{--c:var(--l)}.sy-err{--c:var(--a)}.sy-paused{--c:var(--u)}
.sync-st.sy-err,.sync-st.sy-off{border-color:color-mix(in srgb,var(--c) 45%,var(--border))}
.sy-busy .ic{animation:syspin 1s linear infinite}
@keyframes syspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sy-busy .ic{animation:none}}
.sy-n{display:none;position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--c);color:#fff;font-size:.68rem;font-weight:800;line-height:19px;text-align:center;box-sizing:border-box}
[data-layout=phone] .sync-st,.narrow-search .sync-st,.short .sync-st{padding:0;width:44px;justify-content:center}
[data-layout=phone] .sync-st .sy-l,.narrow-search .sync-st .sy-l,.short .sync-st .sy-l{display:none}
[data-layout=phone] .sy-n,.narrow-search .sy-n,.short .sy-n{display:block}
@media (max-width:399px){[data-layout=phone] .topbar.has-sync #theme-btn{display:none}}
.sync-note{display:flex;gap:8px;align-items:flex-start;margin:0;padding:10px 12px;border-radius:12px;font-size:.86rem;background:var(--surface-2);color:var(--text);overflow-wrap:anywhere}
.sync-note>.ic{flex:none;margin-top:2px}
.sync-note.warn{margin:0;background:color-mix(in srgb,var(--l) 12%,var(--surface));color:var(--text)}
.sync-note.warn>.ic{color:var(--l)}
.sync-note.bad{background:color-mix(in srgb,var(--a) 11%,var(--surface))}
.sync-note.bad>.ic{color:var(--a)}
.sync-note.good{background:color-mix(in srgb,var(--p) 12%,var(--surface))}
.sync-note.good>.ic{color:var(--p)}
.sync-msg:empty{display:none}
.sync-state{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,var(--border))}
.sync-state>.ic{color:var(--c);width:28px;height:28px;flex:none}
.sync-state>div{display:flex;flex-direction:column;min-width:0}
.sync-state b{color:var(--text)}
.sync-dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:.86rem}
.sync-dl dt{color:var(--muted);font-weight:700}
.sync-dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sync-url{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.78rem}
.sync-steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:10px;line-height:1.5}
.sync-steps li{padding-left:4px}
.sync-steps li::marker{font-weight:800;color:var(--brand-2)}
.sync-steps code{font-size:.85em;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.sync-guide .modal-b{display:flex;flex-direction:column;gap:14px}
.sync-code .modal-b{display:flex;flex-direction:column;gap:10px}
#gs-code{width:100%;min-height:220px;height:42vh;resize:vertical;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:10px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);white-space:pre;overflow:auto;box-sizing:border-box}
.sync-copied .ic{color:var(--p);vertical-align:-3px}
.sync-ul{margin:0 0 10px;padding-left:1.2em}
.sync-summary p{margin:0 0 10px}
.sync-choice .modal-f,.sync-sum .modal-f{flex-wrap:wrap}
.sync-open{margin-top:8px}
/* ============ face recognition ============ */
.mark-head-acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.fc-open{white-space:nowrap}
.mark-compact .mark-head .fc-open{min-width:44px;padding:0 12px}
[data-layout=phone] .mark-compact .mark-head .fc-open-l{display:none}
.short-seg .mark-head-acts{justify-content:flex-start}
.via-tag{display:inline-flex;align-items:center;gap:3px;padding:0 7px;border-radius:999px;font-size:.74rem;font-weight:700;background:color-mix(in srgb,var(--brand) 12%,var(--surface));color:var(--brand-text,var(--brand));white-space:nowrap;vertical-align:1px}
.via-tag .ic{width:13px;height:13px}
.modal.face-modal{max-width:1080px}
.face-modal .modal-h h2,.face-privacy .modal-h h2,.face-roster .modal-h h2{display:flex;align-items:center;gap:8px}
.fc-banner{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;font-size:.86rem;background:color-mix(in srgb,var(--gold) 16%,var(--surface));overflow-wrap:anywhere}
.fc-banner>.ic{flex:none;margin-top:2px;color:var(--brand)}
.fc-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.fc-left,.fc-right{min-width:0;display:flex;flex-direction:column;gap:8px}
.fc-stage{position:relative;width:100%;aspect-ratio:4/3;max-height:min(46vh,460px);max-height:min(46dvh,460px);border-radius:16px;overflow:hidden;background:#111}
.fc-stage video,.fc-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fc-stage video{object-fit:contain}
.fc-stage video.mirror{transform:scaleX(-1)}
.fc-stage .fc-still{object-fit:contain;background:#111}
.fc-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:max-content;max-width:calc(100% - 24px);padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.66);color:#fff;font-size:.88rem;text-align:center;line-height:1.5;overflow-wrap:anywhere}
.fc-msg .btn{margin-top:8px;color:var(--text)}
.fc-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fc-tools .icon-btn{margin-left:auto}
.fc-perf{min-height:1.2em}
.fc-auto{font-weight:600}
.fc-qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fc-qhead h3,.fc-marked h3{margin:0;font-size:1rem}
.fc-queue{display:flex;flex-direction:column;gap:8px}
.fq-empty{margin:0;padding:12px;border-radius:12px;background:var(--surface-2)}
.fq-item{position:relative;display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--border);border-left:4px solid var(--brand);border-radius:14px;background:var(--surface)}
.fq-item.low{border-left-color:#e65100}
.fq-item.unknown{border-left-color:var(--a)}
.fq-item.done{border-left-color:var(--p);background:color-mix(in srgb,var(--p) 8%,var(--surface))}
.fq-crop{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:#222;display:block}
.fq-arrow{align-self:center;color:var(--muted);font-weight:800;flex:none}
.fq-item>.avatar{align-self:center}
.fq-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;overflow-wrap:anywhere}
.fq-sub{font-size:.84rem;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.fq-warn{font-size:.82rem;color:var(--l);display:flex;gap:4px;align-items:flex-start}
.fq-warn .ic{flex:none;margin-top:2px}
.fq-cands{display:flex;flex-wrap:wrap;gap:6px}
.fq-cands .chip-btn{max-width:100%;white-space:normal;overflow-wrap:anywhere}
.fq-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fq-sel{flex:1 1 150px;min-width:0;max-width:100%;min-height:40px}
.fq-n{position:absolute;left:-2px;top:-8px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--text);color:var(--surface);font-size:.75rem;font-weight:800;display:grid;place-items:center}
.pill.conf-hi{--c:var(--p)}.pill.conf-mid{--c:var(--brand)}.pill.conf-lo{--c:#e65100}
.fc-marked{display:flex;flex-direction:column;gap:6px}
.fc-marked:empty{display:none}
.fm-row{display:flex;align-items:center;gap:10px;min-width:0;overflow-wrap:anywhere}
.fc-foot-note{margin-right:auto;align-self:center}
@media (min-width:860px){.fc-layout{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}.fc-stage{max-height:min(60vh,520px);max-height:min(60dvh,520px)}.fc-right{max-height:min(62vh,600px);overflow:auto;padding-right:2px}}
.short .fc-layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.short .fc-stage{max-height:calc(100dvh - 150px);max-height:calc(100vh - 150px);min-height:150px}
.short .face-modal .fc-banner{font-size:.8rem;padding:6px 10px}
/* privacy notice */
.fnotice{display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
.fnotice h3{margin:8px 0 0;font-size:1rem}
.fnotice ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.fnotice li{line-height:1.45}
.fn-lead{display:flex;gap:10px;align-items:flex-start;margin:0;padding:12px;border-radius:12px;background:var(--surface-2)}
.fn-lead>.ic{flex:none;color:var(--brand);width:22px;height:22px}
.fn-data{margin:0}
.face-privacy .modal-f .fn-del{margin-right:auto}
/* consent + enrollment list */
.fr-sum{display:flex;flex-wrap:wrap;gap:6px}
.fr-sum span{padding:4px 10px;border-radius:999px;background:var(--surface-2);font-size:.84rem}
.fr-list{display:flex;flex-direction:column}
.fr-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:8px 2px;border-bottom:1px solid var(--border)}
.fr-row:last-child{border-bottom:0}
.fr-body{flex:1 1 140px;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.fr-st{white-space:nowrap}
.fr-sw{min-height:44px;font-weight:600}
/* settings + profile */
.face-dyn{display:flex;flex-direction:column;gap:8px}
.fc-range input[type=range]{width:100%;min-height:40px;accent-color:var(--brand-2);padding:0;border:0;background:transparent}
.face-prof{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-top:14px;padding:12px;border-radius:14px;background:var(--surface-2)}
.face-prof>.ic{flex:none;color:var(--brand);width:22px;height:22px}
.fp-body{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.fp-acts{display:flex;flex-wrap:wrap;gap:6px}
.consent-field .switch{font-weight:650}
.face-shots .fs-count{font-weight:700;color:var(--muted);text-align:right}
.fs-res{margin:0;min-height:1.3em}
.fs-res.good{color:var(--p)}.fs-res.bad{color:var(--a)}

/* ---- brand mark (default AGCCI logo or the custom logo on a neutral tile) ---- */
span.logo[data-logo],.es-logo{display:inline-grid;place-items:center;flex:none;overflow:hidden;border-radius:24%;opacity:1;max-width:none}
.logo.custom.wide{border-radius:10px}
.logo.custom.es-logo.wide{border-radius:18px}
span.logo[data-logo]>svg{width:100%;height:100%;display:block}
.logo.custom,.logo-prev.custom{position:relative;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.logo.custom img,.logo-prev.custom img{position:absolute;left:9%;top:9%;width:82%;height:82%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.es-logo{width:112px;height:112px;border-radius:26px}
.logo.custom.es-logo img{left:10%;top:10%;width:80%;height:80%}
.logo.custom.wide img{left:6px;top:4px;width:calc(100% - 12px);height:calc(100% - 8px)}
.brand-wide .brand{flex-direction:column;align-items:flex-start;gap:8px}
.brand-wide .brand .logo.custom.wide{width:min(160px,calc(44px * var(--ar)));height:44px}
.brand-wide .topbar .m-brand .logo.custom.wide{width:calc(34px * var(--ar))}
[data-layout=rail] .brand .logo.custom.wide{width:40px;height:40px}
.brand-wide[data-layout=rail] .brand{align-items:center}
[data-layout=rail] .brand .logo.custom.wide img{left:3px;width:calc(100% - 6px)}
.logo.custom.es-logo.wide{height:96px;width:min(100%,calc(96px * var(--ar)))}
.logo.custom.es-logo.wide img{left:14px;top:12px;width:calc(100% - 28px);height:calc(100% - 24px)}
:root[data-theme=dark] .logo.custom,:root[data-theme=dark] .logo-prev.custom{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}

/* compact phone + face check-in: title, face button and an icon-only Cards/List switch share one row */
@media (max-width:419px){
  .mark-compact.has-face .mark-head .seg-l{display:none}
  .mark-compact.has-face .mark-head .seg button{min-width:40px;min-height:40px;justify-content:center;padding:0 10px}
}
/* wide custom logo in the phone top bar: the logo carries the name; it shrinks before the icon buttons do */
.brand-wide .topbar .m-brand span:not(.logo){display:none}
.brand-wide .topbar .m-brand{min-width:0;flex:0 1 auto}
.brand-wide .topbar .m-brand .logo.custom.wide{min-width:40px;max-width:100%;flex:0 1 auto}
.topbar .top-actions .icon-btn,.topbar .top-actions .badge{flex-shrink:0}
.brand-wide .topbar .top-actions{flex-shrink:0}

/* PDF export: participant list line under the summary card */
.roster-row{margin-top:8px;gap:6px}
.roster-row .muted{display:inline-flex;align-items:center;gap:5px;margin-right:2px}
/* Settings → Sync: photo status + “Re-download photos from Drive” */
.sync-dl dd.sync-photos-dd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.sync-dl dd.sync-photos-dd .btn{white-space:normal;text-align:left;max-width:100%}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Main navigation">
    <a class="brand" href="#/dashboard"><span class="logo" data-logo="0"></span><span><b>AGCCI</b><span data-bootcamp-name>African Girls Can Code Initiative</span></span></a>
    <nav class="nav" id="side-nav"></nav>
    <div class="side-foot"><div id="side-sample"></div><div>Attendance · data stays on this device</div></div>
  </aside>
  <div class="main-wrap">
    <header class="topbar" id="topbar">
      <a class="m-brand" href="#/dashboard"><span class="logo" data-logo="1"></span><span>AGCCI</span></a>
      <div class="search" role="search">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="gsearch" type="search" placeholder="Search students…" autocomplete="off" aria-label="Search students">
        <kbd>/</kbd>
        <div class="results" id="gresults" hidden></div>
      </div>
      <div class="top-actions">
        <span id="top-sample"></span>
        <span id="sync-slot"></span>
        <button class="icon-btn search-toggle" data-act="toggleSearch" aria-label="Search"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
        <button class="icon-btn" data-act="toggleTheme" aria-label="Toggle dark mode" id="theme-btn"></button>
        <a class="icon-btn settings-link" href="#/settings" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></a>
      </div>
    </header>
    <div id="banner"></div>
    <main id="view" tabindex="-1"></main>
  </div>
  <nav class="bottomnav" id="bottom-nav" aria-label="Main navigation"></nav>
</div>
<div id="modal-root"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="print-root"></div>
<input type="file" id="file-import" accept=".csv,.tsv,.txt,.xlsx,text/csv" hidden>
<input type="file" id="file-restore" accept=".json,application/json" hidden>

/* ---------- in-app square camera (getUserMedia) with native fallback ---------- */
const canLiveCamera = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && window.isSecureContext !== false;

  const f = (await pickFiles({ capture: 'environment' }))[0]; if (!f) return null;

}
function cameraCapture(name) {
  if (!canLiveCamera()) return nativeCapture(name);

    const stop = () => { if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null; };
    openModal({
      title: `Take photo${name ? ' · ' + esc(name) : ''}`, cls: 'photo-modal cam-modal',

        <div class="cam-bar" id="cam-live"><button type="button" class="icon-btn cam-flip" id="cam-flip" aria-label="Switch front/back camera" title="Switch camera" style="visibility:hidden">${icon('flip')}</button><button type="button" class="shutter" id="cam-snap" aria-label="Capture photo" autofocus disabled></button><button type="button" class="icon-btn" id="cam-file" aria-label="Choose a picture instead" title="Choose a picture instead">${icon('upload')}</button></div>
        <p class="muted small crop-hint" id="cam-hint">Only the square is saved — centre the face inside it.</p>`,
      foot: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn" id="cam-retake" hidden>${icon('undo', 'sm')} Retake</button><button class="btn" id="cam-adjust" hidden>Adjust</button><button class="btn btn-primary" id="cam-use" hidden>${icon('check', 'sm')} Use photo</button>`,
      async onMount(el, close) {

        const btn = (id) => el.querySelector(id);
        const setMode = (captured) => { v.hidden = captured; shot.hidden = !captured; btn('#cam-live').hidden = captured; ['#cam-retake', '#cam-adjust', '#cam-use'].forEach((i) => (btn(i).hidden = !captured)); btn('#cam-hint').textContent = captured ? 'This square will be saved. Use it, retake, or adjust the crop.' : 'Only the square is saved — centre the face inside it.'; };

            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 1280 } }, audio: false });
            if (!el.isConnected) { stop(); return; }

          } catch (e) {
            stop();
            const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
            msg.innerHTML = `${denied ? 'Camera access was blocked.' : 'No camera available here.'}<br><button type="button" class="btn btn-sm" id="cam-native">${icon('upload', 'sm')} Use the phone camera / choose a picture</button>`;
            msg.querySelector('#cam-native').onclick = () => { fallback = true; close(); };
          }
        }
        snap.onclick = () => {
          const w = v.videoWidth, h = v.videoHeight; if (!w || !h) return;
          frame = document.createElement('canvas'); frame.width = w; frame.height = h;
          const fx = frame.getContext('2d'); if (mirror) { fx.translate(w, 0); fx.scale(-1, 1); } fx.drawImage(v, 0, 0, w, h);
          const s = Math.min(w, h), px = Math.round(v.clientWidth * (window.devicePixelRatio || 1)) || 320; shot.width = shot.height = px;

        flip.onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; localStorage.setItem('agcci-cam', facing); start(); };
        btn('#cam-retake').onclick = () => { frame = null; setMode(false); };
        btn('#cam-use').onclick = async (e) => { e.target.disabled = true; result = await exportSquare(frame); close(); };
        btn('#cam-adjust').onclick = async () => { const b = await cropEditor(frame, { title: 'Adjust photo' }); if (b) { result = b; close(); } };
        btn('#cam-file').onclick = () => { fallback = 'file'; close(); };
        setMode(false); start();
      },
      async onClose() {
        stop();

      },
    });
  });
}
async function uploadPhoto(name) {

/* ---------- bulk photo import (match files to students by name / ID) ---------- */
const normTxt = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const alnum = (s) => normTxt(s).replace(/[^a-z0-9]/g, '');
const fileKey = (n) => normTxt(String(n).replace(/\.[a-z0-9]{2,5}$/i, '')).replace(/\(\d+\)|\bcopy\b|\b(img|image|photo|pic|dsc|pxl)\b/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim();
function bigrams(s) { const m = new Map(); for (let i = 0; i < s.length - 1; i++) { const g = s.slice(i, i + 2); m.set(g, (m.get(g) || 0) + 1); } return m; }
function dice(a, b) { if (a === b) return 1; if (a.length < 2 || b.length < 2) return 0; const A = bigrams(a), B = bigrams(b); let n = 0; for (const [g, c] of A) n += Math.min(c, B.get(g) || 0); return (2 * n) / (a.length + b.length - 2); }
function nameScore(key, name) {
  const nk = fileKey(name); if (!key) return 0; if (nk === key) return 1;
  const ft = key.split(' ').filter((t) => t.length > 1 && !/^\d+$/.test(t)), nt = nk.split(' ').filter(Boolean);
  if (!ft.length) return 0;
  const tok = nt.reduce((a, t) => a + Math.max(0, ...ft.map((f) => (f === t ? 1 : dice(f, t)))), 0) / Math.max(nt.length, ft.length);
  return Math.max(tok, dice(ft.join(''), alnum(name)));
}
function matchPhotoFile(fname, students) {
  const key = fileKey(fname), ka = key.replace(/ /g, ''), toks = new Set(key.split(' '));
  for (const s of students) { const id = alnum(s.sid); if (id.length >= 3 && (ka === id || toks.has(id) || (id.length >= 5 && ka.includes(id)))) return { s, how: 'id', score: 1 }; }
  const sc = students.map((s) => ({ s, score: nameScore(key, s.name) })).sort((a, b) => b.score - a.score);
  const [a, b] = sc;
  if (!a || a.score < 0.62) return { s: null, how: 'none', score: a ? a.score : 0 };
  if (b && a.score - b.score < 0.06) return { s: a.s, how: 'check', score: a.score };
  return { s: a.s, how: 'name', score: a.score };
}
function openBulkPhotos() {
  if (!S.students.length) { toast('Add students first', { type: 'error' }); return; }
  const B = { items: [], busy: false };
  const opts = (sel) => `<option value="">— Skip —</option>${sortedStudents().map((s) => `<option value="${s.id}" ${sel === s.id ? 'selected' : ''}>${esc(s.name)}${s.sid ? ' · ' + esc(s.sid) : ''}${hasPhoto(s.id) ? ' (has photo)' : ''}</option>`).join('')}`;
  openModal({
    title: 'Import photos', wide: true, cls: 'bulk-photos',
    body: `<div class="drop" id="bp-drop" tabindex="0" role="button" aria-label="Choose photos">${icon('upload', 'lg')}<p style="margin:8px 0 4px"><b>Select or drop many photos at once</b></p><p class="muted small" style="margin:0">Name each file after the student (e.g. <i>Ama Sample.jpg</i>, <i>ama_sample.png</i>) or her Student ID (<i>AGC-001.jpg</i>). Every photo is centre-cropped to a square — use <b>Adjust</b> to fix the crop.</p></div>
      <div id="bp-list"></div>`,
    foot: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="bp-go" disabled>${icon('check', 'sm')} Save photos</button>`,
    onMount(el, close) {
      const drop = el.querySelector('#bp-drop'), list = el.querySelector('#bp-list'), go = el.querySelector('#bp-go');
      drop.onclick = async () => { const fs = await pickFiles({ multiple: true }); if (fs.length) addFiles(fs); };
      drop.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); drop.click(); } };
      ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
      ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
      drop.addEventListener('drop', (e) => addFiles([...e.dataTransfer.files].filter((f) => /^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|bmp|heic)$/i.test(f.name))));
      async function addFiles(files) {
        B.busy = true; go.disabled = true;
        for (let i = 0; i < files.length; i++) {
          list.innerHTML = `<p class="muted small">Reading ${i + 1} of ${files.length}…</p>`;
          const f = files[i], it = { file: f, name: f.name, blob: null, url: '', err: '', m: matchPhotoFile(f.name, S.students) };

          it.sid = it.err ? '' : it.m.s ? it.m.s.id : '';

        B.items.forEach((it, i) => { if (it.sid && best.get(it.sid) !== i) { it.dupOf = studentById(it.sid).name; it.sid = ''; } });
        B.busy = false; draw();

        const m = it.m, manual = !m.s || m.s.id !== it.sid;

        return m.how === 'id' ? `<span class="pill rate-good">Matched by ID${rep}</span>` : m.how === 'check' ? `<span class="pill rate-mid">Please check · ${Math.round(m.score * 100)}%${rep}</span>` : `<span class="pill rate-good">Name match ${Math.round(m.score * 100)}%${rep}</span>`;
      }
      function draw() {
        const n = B.items.filter((it) => it.sid && !it.err).length, unmatched = B.items.filter((it) => !it.sid && !it.err).length, rep = B.items.filter((it) => it.sid && hasPhoto(it.sid)).length;
        list.innerHTML = B.items.length ? `<div class="bp-sum"><b>${n} of ${plural(B.items.length, 'photo')}</b> matched${unmatched ? ` · <span style="color:var(--a)">${unmatched} need a student or will be skipped</span>` : ''}${rep ? ` · ${rep} will replace existing photos` : ''}</div>
          <div class="bp-grid" id="bp-grid">${B.items.map((it, i) => `<div class="bp-item ${it.sid ? 'ok' : 'miss'}" data-i="${i}">
            <span class="bp-thumb">${it.url ? `<img src="${it.url}" alt="">` : icon('alert')}</span>
            <div class="bp-info"><div class="bp-file" title="${esc(it.name)}">${esc(it.name)}</div>${statusOf(it)}
              <div class="bp-ctl"><select data-bp-sel="${i}" aria-label="Student for ${esc(it.name)}" ${it.err ? 'disabled' : ''}>${opts(it.sid)}</select>${it.err ? '' : `<button type="button" class="btn btn-sm" data-bp-adj="${i}">Adjust</button>`}</div></div></div>`).join('')}</div>
          <button type="button" class="link small" id="bp-more">+ Add more photos</button>` : '';
        go.disabled = !n || B.busy; go.innerHTML = `${icon('check', 'sm')} Save ${n ? plural(n, 'photo') : 'photos'}`;
        list.querySelectorAll('[data-bp-sel]').forEach((sel) => (sel.onchange = () => {
          const it = B.items[+sel.dataset.bpSel]; const v = sel.value;
          if (v) B.items.forEach((o) => { if (o !== it && o.sid === v) { o.sid = ''; o.dupOf = studentById(v).name; } });
          it.sid = v; it.dupOf = ''; draw();
        }));
        list.querySelectorAll('[data-bp-adj]').forEach((b) => (b.onclick = async () => {
          const it = B.items[+b.dataset.bpAdj]; const nb = await cropEditor(it.img, { title: `Adjust · ${it.name}` });
          if (nb) { URL.revokeObjectURL(it.url); it.blob = nb; it.url = URL.createObjectURL(nb); draw(); }
        }));
        const more = list.querySelector('#bp-more'); if (more) more.onclick = () => drop.click();
      }
      go.onclick = async () => {
        const todo = B.items.filter((it) => it.sid && it.blob); go.disabled = true;
        for (const it of todo) await setPhoto(it.sid, it.blob);
        B.items.forEach((it) => it.url && URL.revokeObjectURL(it.url));
        close(); toast(`Saved ${plural(todo.length, 'photo')}`, { type: 'success' }); render();
      };
    },
  });
}

/* ============ absence reasons & notes ============ */
const OTHER = 'Other';
const reasonList = () => S.settings.reasons;
const needsReason = (st) => st === 'A' || st === 'E';
const reasonCat = (r) => (!r ? '' : reasonList().includes(r) ? r : OTHER);
const firstName = (s) => String(s.name).trim().split(/\s+/)[0];

/* Reason counts for absences (A/E) among `students` over `dates`, plus repeated-reason flags (3+ of the same). */
function reasonStats(students = S.students, dates = sessionDates()) {
  const by = new Map(), per = new Map(); let withR = 0, absences = 0;
  for (const s of students) for (const d of dates) {
    const e = effStatus(d, s); if (!needsReason(e)) continue;
    absences++;
    const r = markExtra(d, s.id).reason; if (!r) continue;
    withR++;
    const c = reasonCat(r); by.set(c, (by.get(c) || 0) + 1);
    const key = c === OTHER ? 'o:' + r.toLowerCase() : c;
    if (!per.has(s.id)) per.set(s.id, new Map());
    const m = per.get(s.id), cur = m.get(key) || { label: r, n: 0, last: d }; cur.n++; cur.last = d; m.set(key, cur);
  }
  const flags = [];
  per.forEach((m, sid) => m.forEach((v) => { if (v.n >= 3) flags.push({ s: studentById(sid), reason: v.label, n: v.n, last: v.last }); }));
  flags.sort((a, b) => b.n - a.n || byName(a.s, b.s));
  return { by: [...by.entries()].sort((a, b) => b[1] - a[1]), withR, absences, flags };
}
function reasonBarsHTML(rs, empty) {
  if (!rs.by.length) return `<p class="muted small" style="margin:0">${empty || 'No absence reasons recorded yet.'}</p>`;
  const max = rs.by[0][1];
  return `<div class="rs-bars">${rs.by.map(([r, n]) => `<div class="rs-row"><span class="rs-l">${esc(r)}</span><div class="bar"><i style="width:${(n / max) * 100}%"></i></div><b class="rs-n">${n}</b></div>`).join('')}</div>
    <p class="muted small" style="margin:8px 0 0">${rs.withR} of ${plural(rs.absences, 'absence')} (incl. excused) have a reason.</p>`;
}
const flagPill = (f) => `<span class="pill rate-mid" title="${f.n} absences with this reason">${icon('alert', 'sm')} ${f.n}× ${esc(f.reason)}</span>`;
